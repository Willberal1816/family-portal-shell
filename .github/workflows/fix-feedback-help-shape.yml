name: Fix feedback help payload shape

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-feedback-help-shape.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch feedback payload
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="whatWouldHelp:help.trim(),studentNote:note.trim()"
          new="whatWouldHelp:[help.trim()],studentNote:note.trim()"
          if old not in s:
              raise SystemExit('Expected feedback payload pattern not found; refusing unsafe patch.')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          if new not in p.read_text(encoding='utf-8'):
              raise SystemExit('Feedback payload patch validation failed.')
          PY
          cat > .github/workflows/fix-feedback-help-shape.yml <<'YML'
          name: Retired feedback help patch helper
          on:
            workflow_dispatch:
          permissions:
            contents: read
          jobs:
            retired:
              runs-on: ubuntu-latest
              steps:
                - run: echo "Feedback help payload repair is already deployed."
          YML
      - name: Commit repair
        run: |
          git config user.name 'Willberal1816'
          git config user.email '204775082+Willberal1816@users.noreply.github.com'
          git add index.html .github/workflows/fix-feedback-help-shape.yml
          git commit -m 'Fix student feedback help payload'
          git push
