name: Label mastery checks correctly

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-feedback-help-shape.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update mastery check step label
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="paper.forEach(function(x){x.title=String(a.subject||'').toLowerCase()==='reading'?'Complete Your Reading Response':'Print and Complete Your Practice Sheet';out.push(x)});"
          new="paper.forEach(function(x){x.title=String(a.subject||'').toLowerCase()==='reading'?'Complete Your Reading Response':/mastery check/i.test(String((x.resource||{}).label||''))?'Print and Complete Your Mastery Check':'Print and Complete Your Practice Sheet';out.push(x)});"
          if old not in s:
              raise SystemExit('paper step title anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit portal patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Label mastery checks in student lessons"
          git push
