name: Apply mastery feedback and parent decision UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-feedback-help-shape.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch School Portal
        run: echo '' | base64 -d > /tmp/patch_portal.py && python /tmp/patch_portal.py
      - name: Commit portal patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add mastery readiness and parent decisions"
          git push
