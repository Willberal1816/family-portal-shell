name: One-time portal lesson continuity fix

on:
  push:
    paths:
      - '.github/workflows/fix-feedback-help-shape.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve active class across lesson navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          marker="function api(action,params){"
          continuity="""var ACTIVE_CLASS_KEY='moranSchoolActiveClass';
function rememberActiveClass(a){if(previewMode||!a)return;try{localStorage.setItem(ACTIVE_CLASS_KEY,JSON.stringify({id:String(a.id||''),row:Number(a.row||0),date:currentDate}))}catch(e){}}
function readActiveClass(){try{return JSON.parse(localStorage.getItem(ACTIVE_CLASS_KEY)||'null')}catch(e){return null}}
function clearActiveClass(){try{localStorage.removeItem(ACTIVE_CLASS_KEY)}catch(e){}}
function reconcileActiveClass(d){var r=readActiveClass();if(!r||r.date!==currentDate){if(r)clearActiveClass();return null}var list=(d&&d.assignments)||[],a=null;for(var i=0;i<list.length;i++){if((r.id&&String(list[i].id||'')===r.id)||(!r.id&&r.row&&Number(list[i].row)===Number(r.row))){a=list[i];break}}if(!a||a.status==='Done'){clearActiveClass();return null}if(a.status==='Not Started'){a.status='In Progress';api('start',{row:a.row}).catch(function(){})}return a}
function returnToDay(){clearActiveClass();loadDay()}
"""
          if "var ACTIVE_CLASS_KEY='moranSchoolActiveClass';" not in s:
              if marker not in s: raise SystemExit('api marker not found')
              s=s.replace(marker,continuity+marker,1)

          old="function loadDay(){stopClock();stopFollowUpTimers();active=null;updateDateNav();document.body.className='';document.getElementById('app').innerHTML='<div class=\"card empty\">Opening school day…</div>';api('data',{date:currentDate}).then(function(d){data=d;resetTodayLocalProgress(d);renderDay()}).catch(errorBox)}"
          new="function loadDay(){stopClock();stopFollowUpTimers();active=null;updateDateNav();document.body.className='';document.getElementById('app').innerHTML='<div class=\"card empty\">Opening school day…</div>';api('data',{date:currentDate}).then(function(d){data=d;resetTodayLocalProgress(d);var resume=reconcileActiveClass(d);renderDay();if(resume)showWork(resume)}).catch(errorBox)}"
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('loadDay pattern not found')

          old="function startWork(row,btn){var a=findAssignment(row);if(!a)return;if(a.refresher){if(btn){btn.disabled=false;btn.textContent='Start'}showWork(a,0);return}if(btn){btn.disabled=true;btn.textContent='Starting…'}api('start',{row:row}).then(function(){a.status='In Progress';showWork(a)}).catch(errorBox)}"
          new="function startWork(row,btn){var a=findAssignment(row);if(!a)return;if(a.refresher){if(btn){btn.disabled=false;btn.textContent='Start'}showWork(a,0);return}rememberActiveClass(a);if(btn){btn.disabled=true;btn.textContent='Starting…'}api('start',{row:row}).then(function(){a.status='In Progress';showWork(a)}).catch(function(err){a.status='In Progress';showWork(a);setTimeout(function(){api('start',{row:row}).catch(function(){})},1200)})}"
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('startWork pattern not found')

          old="function continueWork(row){var a=findAssignment(row);if(!a)return;showWork(a)}"
          new="function continueWork(row){var a=findAssignment(row);if(!a)return;rememberActiveClass(a);showWork(a)}"
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('continueWork pattern not found')

          old="function showWork(a,openIdx){active=a;var steps=buildLessonSteps(a),done=readStepDone(a);"
          new="function showWork(a,openIdx){active=a;if(!previewMode&&a.status!=='Done')rememberActiveClass(a);var steps=buildLessonSteps(a),done=readStepDone(a);"
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('showWork prefix not found')

          old='<div class="actions"><button onclick="loadDay()">Back</button>'
          new='<div class="actions"><button onclick="returnToDay()">Back</button>'
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('work Back button pattern not found')

          old="function finishActive(btn){if(!active)return;if(btn){btn.disabled=true;btn.textContent='Saving…'}if(active.completionMode==='mastery')return openMastery();api('finish',{row:active.row}).then(function(){loadDay()}).catch(errorBox)}"
          new="function finishActive(btn){if(!active)return;if(btn){btn.disabled=true;btn.textContent='Saving…'}if(active.completionMode==='mastery')return openMastery();api('finish',{row:active.row}).then(function(){clearActiveClass();loadDay()}).catch(errorBox)}"
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('finishActive pattern not found')

          old="api('submit',{row:active.row,checkId:checkId,answers:JSON.stringify(ans)}).then(function(r){document.getElementById('app').innerHTML="
          new="api('submit',{row:active.row,checkId:checkId,answers:JSON.stringify(ans)}).then(function(r){if(r.mastered)clearActiveClass();document.getElementById('app').innerHTML="
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('submitMastery pattern not found')

          old="else{h+='<a class=\"lesson-action\" href=\"'+esc(step.resource.url)+'\" target=\"_blank\"><span class=\"step-number\">'+(i+1)+'</span><span class=\"step-title\">'+esc(step.title)+'</span></a>'}"
          new="else{var samePortal=String(step.resource.url||'').indexOf('https://willberal1816.github.io/family-portal-shell/')===0;h+='<a class=\"lesson-action\" href=\"'+esc(step.resource.url)+'\"'+(samePortal?'':' target=\"_blank\" rel=\"noopener\"')+'><span class=\"step-number\">'+(i+1)+'</span><span class=\"step-title\">'+esc(step.title)+'</span></a>'}"
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('lesson link pattern not found')

          required=["moranSchoolActiveClass","reconcileActiveClass(d)","returnToDay()","samePortal"]
          for x in required:
              if x not in s:raise SystemExit('Missing continuity marker: '+x)
          p.write_text(s,encoding='utf-8')
          print('Portal active-class continuity patch verified in source.')
          PY
      - name: Commit portal continuity fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No portal changes needed."
          else
            git commit -m "Preserve class progress across lesson navigation"
            git push
          fi
