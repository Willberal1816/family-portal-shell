name: One-time refresher and schedule repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-refresher-schedule.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch portal and affected lessons
        shell: python
        run: |
          from pathlib import Path
          import re

          portal_path = Path('index.html')
          portal = portal_path.read_text(encoding='utf-8')

          old_break = """function breakStartTime(){if(currentDate==='2026-08-30')return '1:30';if(currentDate==='2026-09-04')return '12:35';return '12:30'}
          function breakTimeLabel(){if(currentDate==='2026-08-30')return '1:30\\u20132:00';if(currentDate==='2026-09-04')return '12:35\\u20131:05';return '12:30\\u20131:00'}
          function needsBreak(items){var split=currentDate==='2026-08-30'?810:(currentDate==='2026-09-04'?755:750),after=currentDate==='2026-08-30'?840:(currentDate==='2026-09-04'?785:780);return (items||[]).some(function(a){return timeRank(a)<split})&&(items||[]).some(function(a){return timeRank(a)>=after})}
          function scheduleWithBreak(items){var out=(items||[]).slice();if(needsBreak(out))out.push({scheduleBreak:true,time:breakStartTime()});return out.sort(function(a,b){return timeRank(a)-timeRank(b)})}"""
          new_break = """var activeBreak=null;
          function clockFromMinutes(n){var h=Math.floor(n/60),m=n%60,ap=h>=12?'PM':'AM',hh=h%12||12;return hh+':'+String(m).padStart(2,'0')}
          function deriveBreak(items){var rows=(items||[]).filter(function(a){return !a.scheduleBreak&&String(a.time||'').trim()}).map(function(a){var s=timeRank(a),d=Math.max(0,Number(a.plannedMinutes||0));return{start:s,end:s+d}}).filter(function(x){return isFinite(x.start)&&x.end>x.start}).sort(function(a,b){return a.start-b.start}),best=null;for(var i=0;i<rows.length-1;i++){var gs=rows[i].end,ge=rows[i+1].start;if(ge-gs<30||ge<690||gs>840)continue;var start=Math.max(gs,Math.min(750,ge-30));if(start<690||start+30>840)continue;var score=Math.abs(start-750);if(!best||score<best.score)best={start:start,end:start+30,score:score}}return best?{time:clockFromMinutes(best.start),label:clockFromMinutes(best.start)+'–'+clockFromMinutes(best.end)}:null}
          function breakStartTime(){return activeBreak?activeBreak.time:''}
          function breakTimeLabel(){return activeBreak?activeBreak.label:''}
          function needsBreak(items){return !!deriveBreak(items)}
          function scheduleWithBreak(items){var out=(items||[]).slice();activeBreak=deriveBreak(out);if(activeBreak)out.push({scheduleBreak:true,time:activeBreak.time});return out.sort(function(a,b){return timeRank(a)-timeRank(b)})}"""
          if old_break not in portal:
              raise SystemExit('Expected fixed-break block not found; refusing unsafe patch')
          portal = portal.replace(old_break, new_break, 1)

          new_attach = """function refresherResourceIsDistinct(a,x){var u=String(x&&x.resource||'').trim();if(!u)return false;function clean(v){return String(v||'').trim().split('#')[0].split('?')[0]}u=clean(u);var urls=[];if(a&&a.resource)urls.push(a.resource);(a&&a.resources||[]).forEach(function(r){if(r&&r.url)urls.push(r.url)});for(var i=0;i<urls.length;i++)if(clean(urls[i])===u)return false;return true}
          function attachRefreshers(items,followUps){var used={};(followUps||[]).forEach(function(x){for(var i=0;i<items.length;i++){var a=items[i],k=subjectKey(a.subject);if(!used[k]&&k===subjectKey(x.subject)&&refresherResourceIsDistinct(a,x)){a.refresher=x;used[k]=true;break}}});return items}"""
          pattern = r"function attachRefreshers\(items,followUps\)\{.*?\}\nfunction renderDay"
          replaced, count = re.subn(pattern, new_attach + '\nfunction renderDay', portal, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected one attachRefreshers block, found {count}; refusing unsafe patch')
          portal_path.write_text(replaced, encoding='utf-8')

          inserts = {
            'worksheets/curriculum/lessons/emma-la-paragraph.html': ('<div class="meta">Emma · Language Arts · Learn First</div>', '<div class="meta">Emma · Language Arts · Learn First</div><h2>Quick refresher from last time</h2><div class="example"><b>Worked reminder:</b> “Although the rain stopped, the sidewalk stayed wet.” is already a complete complex sentence. Keep it as one sentence and use the comma after the opening clause.<br><b>Proofread reminder:</b> After you repair or revise a sentence, read the whole sentence once more for a missing comma, accidental repeated word, or unnecessary split. This is the short reinforcement from your last review; there is no separate worksheet for it.</div>'),
            'worksheets/curriculum/lessons/shared-social-perspective.html': ('<div class="meta">Emma + Natalie · Social Studies · Learn First</div>', '<div class="meta">Emma + Natalie · Social Studies · Learn First</div><h2>Quick refresher from last time</h2><div class="example"><b>Worked reminder:</b> Name the source before you say what the evidence proves. Example: “Source A proves the bridge was closed at noon. Source B adds that police redirected traffic.” Do not claim either source proves details it never reports. This is a brief reminder inside the lesson, not a separate follow-up worksheet.</div>')
          }
          for name,(needle,replacement) in inserts.items():
              p=Path(name); text=p.read_text(encoding='utf-8')
              if replacement in text:
                  continue
              if needle not in text:
                  raise SystemExit(f'Expected insertion point missing in {name}')
              p.write_text(text.replace(needle,replacement,1),encoding='utf-8')
      - name: Validate and commit
        run: |
          git diff --check
          grep -q 'function deriveBreak(items)' index.html
          grep -q 'refresherResourceIsDistinct' index.html
          grep -q 'Quick refresher from last time' worksheets/curriculum/lessons/emma-la-paragraph.html
          grep -q 'Quick refresher from last time' worksheets/curriculum/lessons/shared-social-perspective.html
          git config user.name 'Willberal1816'
          git config user.email 'rmoran4446@mac.com'
          git add index.html worksheets/curriculum/lessons/emma-la-paragraph.html worksheets/curriculum/lessons/shared-social-perspective.html
          git commit -m 'Fix refresher integrity and dynamic school breaks'
          git push