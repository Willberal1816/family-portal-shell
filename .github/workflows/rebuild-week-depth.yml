name: Rebuild full-depth homeschool week
on:
  push:
    paths:
      - '.github/workflows/rebuild-week-depth.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild Sep 1-4 curriculum pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html import escape
          root=Path('worksheets/curriculum')
          CSS=':root{font-family:Arial,sans-serif;color:#172033}body{max-width:900px;margin:auto;padding:24px;background:#f7f9fc}main{background:#fff;border:1px solid #d7dee8;border-radius:18px;padding:30px;line-height:1.58}h1{margin-top:0}h2{margin-top:28px}.box,.example,.guided,.word{padding:14px 16px;border-radius:12px;margin:14px 0}.box{background:#eef5ff}.example{background:#f5f7fa}.guided{background:#eef9f1}.word{background:#fff7df}.q{margin:20px 0;break-inside:avoid}.answer{height:54px;border-bottom:1px solid #9aa5b5;margin-top:8px}.answer.tall{height:95px}.answer.xl{height:150px}.meta,.small{color:#667085}.small{font-size:.94em}li{margin:8px 0}button{padding:10px 14px;border:1px solid #c7cfda;border-radius:10px;background:#fff;font-weight:700}details{margin:12px 0;padding:10px 12px;border:1px solid #d7dee8;border-radius:10px;background:#fafbfd}summary{font-weight:700;cursor:pointer}@media print{body{background:#fff;padding:0}main{border:0;padding:0}button{display:none}details>div{display:block}}'
          def lesson(path,title,meta,obj,teach,vocab,examples,guided,quality):
            h=f'<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{escape(title)}</title><style>{CSS}</style></head><body><main><h1>{escape(title)}</h1><div class="meta">{escape(meta)} · Learn First</div><div class="box"><b>What you are learning:</b> {escape(obj)}</div><h2>Learn the idea</h2>'+''.join(f'<p>{x}</p>' for x in teach)+'<h2>Words you will use</h2><div class="word"><ul>'+''.join(f'<li><b>{escape(k)}:</b> {v}</li>' for k,v in vocab)+'</ul></div><h2>Worked examples</h2>'+''.join(f'<div class="example">{x}</div>' for x in examples)+'<h2>Guided checks</h2>'+''.join(f'<details><summary>{q}</summary><div>{a}</div></details>' for q,a in guided)+f'<h2>Before you practice</h2><div class="guided">{quality}</div><div class="small">When this makes sense, return to the School Portal and open the Practice step.</div></main></body></html>'
            p=root/path;p.parent.mkdir(parents=True,exist_ok=True);p.write_text(h,encoding='utf-8')
          def practice(path,title,meta,directions,groups):
            h=f'<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{escape(title)}</title><style>{CSS}</style></head><body><main><button onclick="print()">Print</button><h1>{escape(title)}</h1><div class="meta">{escape(meta)}</div><div class="box"><b>Directions:</b> {directions}</div>';n=1
            for heading,items in groups:
              h+=f'<h2>{heading}</h2>'
              for item in items:
                q,size=item if isinstance(item,tuple) else (item,'tall');h+=f'<div class="q"><b>{n}.</b> {q}<div class="answer {size}"></div></div>';n+=1
            h+='</main></body></html>';p=root/path;p.parent.mkdir(parents=True,exist_ok=True);p.write_text(h,encoding='utf-8')

          # TUESDAY — Sep 1
          lesson('lessons/natalie-math-fraction-division-2.html','Fraction Division 2','Natalie · Math','Divide mixed numbers and fractions by reasoning about groups, using reciprocals correctly, and checking whether answers make sense.',[
          'Fraction division still means <b>how many groups?</b> If you ask 4 1/2 ÷ 1 1/2, you are asking how many groups of 1 1/2 fit inside 4 1/2. Thinking about the groups first gives the procedure a meaning instead of turning the work into a memorized flip-and-multiply trick.',
          'When a mixed number appears, rewrite it as an improper fraction before multiplying. For 2 3/4, multiply the whole number by the denominator, add the numerator, and keep the denominator: 2 3/4 = 11/4. Then identify the divisor—the number you are dividing by. Only the divisor changes to its reciprocal.',
          'The reciprocal works because division asks for an inverse operation. Dividing by 3/4 is the same as asking how many three-fourths-sized groups fit. Multiplying by 4/3 scales by the inverse amount. Estimate before calculating: dividing by a positive number less than 1 should make the quotient larger; dividing by a number greater than 1 should usually make it smaller.',
          'Check a difficult quotient with multiplication. If 7/3 ÷ 2/3 = 7/2, then 7/2 × 2/3 should return 7/3. In word problems, keep units attached so the quotient has meaning: pieces, batches, miles per segment, and so on.'
          ],[('dividend','the amount being divided'),('divisor','the amount you are dividing by'),('quotient','the result of division'),('reciprocal','a fraction with numerator and denominator switched')],[
          '<b>Example 1:</b> 4 1/2 ÷ 1 1/2 = 9/2 ÷ 3/2 = 9/2 × 2/3 = 3. Check: three groups of 1 1/2 equal 4 1/2.',
          '<b>Example 2:</b> 2 2/3 ÷ 4/5 = 8/3 × 5/4 = 10/3 = 3 1/3. Since 4/5 is less than 1, a quotient larger than 2 2/3 is reasonable.',
          '<b>Example 3:</b> A 6 1/4-foot ribbon cut into 1 1/4-foot pieces gives 25/4 ÷ 5/4 = 5 pieces.'
          ],[('Before calculating, should 3 1/2 ÷ 7/8 be greater or less than 3 1/2?','Greater, because the divisor is less than 1.'),('Which number is flipped in 5/6 ÷ 2 1/2?','The divisor: 2 1/2 = 5/2, so use 2/5.'),('How can multiplication check a division answer?','Multiply quotient × divisor and see whether it returns the dividend.')],'<b>Strong work shows:</b> mixed-number conversions, only the divisor reciprocated, simplification, units, and a reasonableness check.')
          practice('natalie-math-fraction-division-2.html','Fraction Division 2','Natalie · Math','Show enough work to make your reasoning visible. Estimate or predict the size of the answer when asked.',[
          ('Meaning and setup',[('Explain what 5 1/4 ÷ 3/4 means in a ribbon-cutting situation without solving yet.','tall'),('Convert 3 2/5 and 1 3/4 to improper fractions. Identify which fraction is flipped in the division expression.','tall'),('Predict whether 2 1/2 ÷ 5/6 is greater or less than 2 1/2 and explain.','tall')]),
          ('Compute carefully',['4 1/2 ÷ 1 1/2','3 3/4 ÷ 1 1/4','2 2/3 ÷ 5/6','5 1/6 ÷ 2/3','7/8 ÷ 1 3/4']),
          ('Applications',[('A 6 3/4-foot board is cut into 1 1/8-foot pieces. How many full pieces can be cut, and what does any leftover mean?','tall'),('A recipe uses 2/3 cup yogurt per batch. You have 3 1/2 cups. How many full batches can you make and what remains?','tall'),('A cyclist travels 8 1/4 miles in equal 1 1/2-mile segments. Interpret the quotient.','tall')]),
          ('Reason and create',[('A student writes 2 1/4 ÷ 3/5 = 9/4 × 3/5. Diagnose and correct the exact error.','tall'),('Without fully calculating, decide which is larger: 4 ÷ 2/3 or 4 ÷ 5/6. Explain using group size.','tall'),('Create a mixed-number division word problem with a quotient between 2 and 4. Solve and verify by multiplication.','xl')])])

          lesson('lessons/emma-math-coordinate-interpret.html','Plot & Interpret Coordinates','Emma · Math','Plot and read points in all four quadrants and explain what ordered pairs mean in a picture or situation.',[
          'An ordered pair is written (x, y). The x-coordinate tells how far to move left or right from the origin. The y-coordinate tells how far to move down or up. Always move across first, then up or down.',
          'The signs tell direction. Positive x is right; negative x is left. Positive y is up; negative y is down. That creates four quadrants. A point on an axis has one coordinate equal to zero and is not inside a quadrant.',
          'Coordinates can represent locations, movement, game positions, maps, or data. Strong graph reading goes both directions: from an ordered pair to a point and from a plotted point back to its ordered pair.',
          'A common mistake is swapping x and y or ignoring a negative sign. Say the movement aloud: “x = -3 means left 3; y = 5 means up 5.” Then check the quadrant before you finish.'
          ],[('origin','the point (0,0), where the axes cross'),('ordered pair','two numbers (x,y) that locate a point'),('quadrant','one of four regions made by the axes'),('axis','a number line on the coordinate plane')],[
          '<b>Example 1:</b> (-4,3): left 4, up 3, Quadrant II.','<b>Example 2:</b> (5,-2): right 5, down 2, Quadrant IV.','<b>Example 3:</b> (0,-6) lies on the y-axis because x=0.'
          ],[('Where is (-2,-5)?','Quadrant III: left 2 and down 5.'),('What is special about (7,0)?','It lies on the x-axis.'),('A point is left of the y-axis and above the x-axis. What signs does it have?','Negative x, positive y.')],'<b>Strong work shows:</b> x before y, careful signs, labeled axes, and sentences connecting points to what they represent.')
          practice('emma-math-coordinate-interpret-1.html','Plot & Interpret Coordinates','Emma · Math','Use graph paper or draw a coordinate plane. Label axes and every point clearly.',[
          ('Read the signs',[('Write quadrant or axis for A(3,4), B(-2,5), C(-4,-1), D(6,-3), E(0,5), F(-7,0).','tall'),('Explain why (-3,4) and (3,-4) are not the same point.','tall')]),
          ('Plot and interpret',[('Plot P(-5,2), Q(4,3), R(3,-4), and S(-2,-5). Label every point.','xl'),('Which plotted points are below the x-axis? Explain from their ordered pairs.','tall'),('Write a new point in Quadrant II and explain its sign pattern.','tall'),('Write one point on each axis and explain why axis points are not in quadrants.','tall')]),
          ('Routes and situations',[('A robot travels (0,0) → (4,0) → (4,-3) → (-2,-3). Plot and describe every move.','xl'),('A fountain is (-3,2), a bench is (2,2), and a gate is (2,-4). Which locations share a y-coordinate and what does that mean?','tall'),('Correct: “(-6,1) means down 6 and right 1.” Explain the x-then-y rule.','tall')]),
          ('Create',[('Create four points, one in each quadrant, that form a rectangle. Plot and list them.','xl'),('Write a mystery-point clue using quadrant, x, and y so exactly one point can be identified.','tall')])])

          lesson('lessons/emma-la-sentences.html','Fix the Sentence','Emma · Language Arts','Recognize complete sentences, fragments, and run-ons, then revise them so ideas are clear and correctly punctuated.',[
          'A complete sentence needs a subject—who or what the sentence is about—and a predicate that tells what the subject does or is. “The dog barked.” works because the reader knows who and what happened.',
          'A fragment looks like part of a sentence but does not express a complete thought. “Because the dog barked.” makes the reader wait for what happened because of the barking. Add the missing idea: “Because the dog barked, the baby woke up.”',
          'A run-on pushes complete sentences together without correct joining. A comma alone cannot safely join two complete sentences; that error is a comma splice. Repair a run-on with a period, a semicolon, or a comma plus a joining word such as and, but, or so.',
          'Editing is about meaning, not just punctuation. Read aloud, find each complete thought, decide which ideas belong together, then choose punctuation that shows the relationship clearly.'
          ],[('subject','who or what the sentence is about'),('predicate','what the subject does or is'),('fragment','an incomplete sentence'),('run-on','complete thoughts joined incorrectly'),('comma splice','two complete sentences joined with only a comma')],[
          '<b>Fragment:</b> “After we finished dinner.” → “After we finished dinner, we played cards.”','<b>Run-on:</b> “The rain stopped we went outside.” → “The rain stopped, so we went outside.”','<b>Comma splice:</b> “I found my book, it was under the couch.” → “I found my book. It was under the couch.”'
          ],[('Is “Running through the muddy yard.” complete?','No. It does not tell who is running.'),('Give two fixes for “Mia practiced, she felt ready.”','Use a period, or use comma + so.'),('Why choose a period instead of “and”?','A period gives complete ideas more separation or emphasis.')],'<b>Strong work shows:</b> you can name the problem, explain what is missing or wrongly joined, and revise without changing the intended meaning.')
          practice('emma-la-sentences-1.html','Fix the Sentence','Emma · Language Arts','Rewrite the entire corrected sentence. When more than one answer works, choose the clearest version.',[
          ('Diagnose',['Label Complete, Fragment, or Run-on: “The tiny kitten slept in the basket.”','Label: “Because the movie ended late.”','Label: “I packed my lunch I forgot my water bottle.”','Label: “The wind shook the windows, the dog hid under the table.”']),
          ('Repair',[('Fix: “While Emma waited for the cookies to cool.”','tall'),('Fix: “The trail was steep we kept hiking.”','tall'),('Fix the comma splice: “I wanted the blue marker, Natalie was using it.”','tall'),('Combine clearly: “The plant leaned toward the window. It needed more light.”','tall')]),
          ('Choose punctuation',[('Join with a comma and a joining word: “The recipe looked easy. We read every step first.”','tall'),('Rewrite as two sentences: “The puppy chased the ball it slid under the chair he barked at it.”','tall')]),
          ('Edit in context',[('Rewrite: “Saturday morning. We planned to ride bikes the tire was flat. Because Dad found the pump. We fixed it, we left after lunch.”','xl'),('Write a 5–6 sentence paragraph about a small problem. Include one sentence joined with and, but, or so. Reread and check every ending mark.','xl')])])

          lesson('lessons/natalie-la-paragraph.html','Build a Strong Paragraph','Natalie · Language Arts','Build a focused paragraph with a clear point, specific evidence or details, explanation, logical order, and a satisfying ending.',[
          'A strong paragraph is more than several sentences about the same broad topic. It has a controlling idea: one focused point the paragraph develops. Every sentence should help the reader understand that point.',
          'Specific evidence or details make the paragraph believable and useful. If the point is “The storm changed the town quickly,” details such as flooded streets, a closed bridge, or a power outage do more work than vague wording.',
          'After a detail, explain why it matters. Evidence answers “What happened?” Explanation answers “So what does that show?” Writers often skip this step, leaving the reader to make the connection alone.',
          'Order matters. Arrange ideas so the reader can follow them—by cause and effect, time, importance, or another logical pattern. Transitions should clarify the relationship rather than decorate the paragraph.'
          ],[('controlling idea','the focused point the paragraph develops'),('evidence','specific information supporting a point'),('explanation','reasoning showing why evidence matters'),('transition','a word or phrase connecting ideas')],[
          '<b>Weak:</b> “The hike was difficult. It was hard. We were tired.”','<b>Stronger:</b> “The hike became difficult after the trail turned uphill. Loose rocks slowed each step, and we stopped twice to catch our breath. Those details show that the steep, rocky section—not simply the distance—made the hike challenging.”','<b>Useful structure:</b> point → detail → explanation → another detail → explanation → closing sentence.'
          ],[('Which is stronger evidence: “the room was messy” or “three stacks of books blocked the doorway”?','The second is concrete and observable.'),('What should usually follow evidence?','Explanation of what the evidence shows.'),('What should happen to an interesting sentence that does not support the controlling idea?','Remove, move, or revise it so the paragraph stays focused.')],'<b>Strong work shows:</b> one focused idea, precise details, explanation after evidence, purposeful order, and revision for clarity—not mere length.')
          practice('natalie-la-paragraph-1.html','Build a Strong Paragraph','Natalie · Language Arts','Answer in complete sentences. Use precise details and explain why they support your point.',[
          ('Find the focus',[('Write a broad topic sentence about school mornings, then revise it into a focused controlling idea. Explain why the second is stronger.','tall'),('Controlling idea: “The new library layout makes books easier to find.” Which fits better: labeled shelves or blue carpet? Explain.','tall')]),
          ('Strengthen weak writing',[('Revise “The game was exciting. A lot happened. Everyone was happy.” with two concrete details.','tall'),('Add explanation after: “By noon, the creek had risen over the walking path.” The point is that the storm changed routines.','tall'),('Replace vague wording in “The scientist did stuff carefully and got a good result.”','tall')]),
          ('Organize',[('Order and explain: bridge closed; heavy rain fell overnight; buses took a longer route; river rose above the road.','tall'),('Write two cause-and-effect transitions without using “because.”','tall')]),
          ('Build and revise',[('Write an 8–10 sentence paragraph answering: What makes a place comfortable to read or work? Use at least three concrete details and explanation.','xl'),('Underline your controlling idea, box two pieces of evidence, star one explanation, and revise one vague/repetitive/out-of-order sentence.','xl'),('Write 5–7 sentences supporting “Working with a partner can improve a project,” while naming one situation when working alone may be better.','xl')])])

          lesson('lessons/shared-health-recovery.html','Heart Rate Recovery','Emma + Natalie · Health','Measure heart-rate recovery safely, compare observations fairly, and explain a recovery pattern without treating one classroom activity as a medical test.',[
          'When you move more vigorously, working muscles need more oxygen and fuel. The heart responds by pumping blood faster. After activity stops, heart rate usually comes down over time. That change is called recovery.',
          'Today you will compare pulse counts at consistent times. Fair comparison matters more than getting a particular number. If one person counts for 15 seconds and another for 30, or if one waits much longer before measuring, the results cannot be compared fairly.',
          'Keep the movement, duration, pulse-count method, and measurement times the same. These are controlled variables. The thing intentionally changed—time since exercise—is the independent variable in this simple investigation.',
          'Heart rates differ naturally between people and from day to day. This activity teaches body response and data collection; it is not a diagnosis. Use comfortable movement, stop if dizzy, painful, or unwell, and tell a parent.'
          ],[('recovery','return toward a resting state after activity'),('pulse','the beat felt as the heart pumps blood'),('variable','something that can change in an investigation'),('controlled variable','a condition kept the same for a fair comparison')],[
          '<b>Example pattern:</b> Resting 78 bpm → immediately after movement 122 → 1 minute 96 → 2 minutes 84.','<b>Fair test:</b> both trials use 60 seconds of the same movement and pulse is measured at the same recovery times.','<b>Unfair test:</b> comparing jumping for 2 minutes with walking for 30 seconds and blaming the difference on one factor.'
          ],[('Why measure at the same recovery times?','Heart rate changes over time, so different wait times confound the comparison.'),('24 beats in 15 seconds is about how many bpm?','96 bpm.'),('Can one classroom recovery measurement diagnose health?','No.')],'<b>Strong work shows:</b> safe participation, consistent timing, complete data, a pattern described from evidence, and no medical overclaim.')
          practice('shared-health-recovery-1.html','Heart Rate Recovery','Emma + Natalie · Health','Use safe, comfortable movement and have a parent nearby if needed. Stop if you feel dizzy, painful, or unwell.',[
          ('Plan',[('List four things you will keep the same during recovery measurements.','tall'),('Choose a safe 60-second movement and explain why it can be repeated consistently.','tall'),('Predict what pulse will do immediately after movement and over the next two minutes. Explain why.','tall')]),
          ('Collect data',[('Measure resting pulse. Record count interval and calculated beats per minute.','tall'),('After 60 seconds of movement, record pulse as soon as practical.','tall'),('Record pulse 1 minute after stopping.','tall'),('Record pulse 2 minutes after stopping.','tall')]),
          ('Interpret',[('Describe the pattern using your actual numbers. Do not just say “it went down.”','tall'),('Calculate the change from immediately after movement to 2 minutes after.','tall'),('Name one source of measurement error.','tall')]),
          ('Extend',[('What must stay the same to compare a repeat trial tomorrow fairly?','tall'),('<b>Natalie:</b> Explain why changing exercise type and duration together makes cause hard to identify.','tall'),('<b>Emma:</b> Draw a line graph of the four measurements and label both axes.','xl')])])

          lesson('lessons/shared-cooking-measuring.html','Kitchen Measuring Lab','Emma + Natalie · Cooking / Life Skills','Measure liquid and dry ingredients accurately, use common kitchen equivalents, and explain why technique affects a recipe.',[
          'Cooking measurements are small experiments. If the amount changes greatly from one attempt to the next, a recipe can turn out differently. Accuracy starts with the right tool and a consistent technique.',
          'For liquids, place a liquid measuring cup on a flat surface and bring your eyes level with the measurement line. For small quantities, measuring spoons are usually easier and more accurate.',
          'For many dry ingredients, spoon the ingredient into a dry measuring cup and level the top. Do not pack an ingredient unless the recipe says to. Brown sugar is a common exception because recipes often specify packed brown sugar.',
          'Useful equivalents let you scale recipes: 3 teaspoons = 1 tablespoon; 16 tablespoons = 1 cup; 1/2 cup = 8 tablespoons; 1/4 cup = 4 tablespoons. Equivalent fractions are real kitchen tools, not only paper math.'
          ],[('level','even with the top edge of a measuring cup or spoon'),('equivalent measure','a different measurement representing the same amount'),('liquid measure','a cup read while sitting on a flat surface'),('dry measure','a cup filled to the top and leveled')],[
          '<b>Example:</b> 3/4 cup can be measured as 1/2 cup + 1/4 cup.','<b>Example:</b> 2 tablespoons = 6 teaspoons.','<b>Technique:</b> holding a liquid cup in the air can make the measurement line appear higher or lower because of viewing angle.'
          ],[('How can you make 3/4 cup with 1/2 and 1/4 cup measures?','One 1/2 cup plus one 1/4 cup.'),('How many teaspoons are in 2 tablespoons?','6 teaspoons.'),('Why place a liquid cup on a flat surface?','So the level is stable and can be read at eye height.')],'<b>Strong work shows:</b> correct tool choice, careful leveling/reading, equivalent-measure reasoning, and cleanup. Water can be used so no food is wasted.')
          practice('shared-cooking-measuring-lab-1.html','Kitchen Measuring Lab','Emma + Natalie · Cooking / Life Skills','Use water for the hands-on measurements unless a parent chooses another safe ingredient. Wipe spills as you go.',[
          ('Kitchen math',[('Write two ways to make 3/4 cup using common measures.','tall'),('How many teaspoons are in 4 tablespoons? Show the relationship.','tall'),('How can you measure 1 1/2 cups with 1-cup and 1/2-cup measures?','tall'),('If 2/3 cup is doubled, what quantity is needed? Explain.','tall')]),
          ('Water lab',[('Measure 1/2 cup water, pour into a 1-cup measure, and check the level. Record small differences and possible causes.','tall'),('Measure 1/4 cup twice and compare the combined amount with 1/2 cup.','tall'),('Make 1 tablespoon using teaspoons. How many did it take?','tall'),('View the same liquid level from above, below, and eye level. Which view is trustworthy and why?','tall')]),
          ('Technique decisions',[('Why can tightly packing flour into a cup change a recipe?','tall'),('Why does “packed” matter when a recipe specifies packed brown sugar?','tall'),('A cook uses 2 teaspoons instead of 2 tablespoons. How much smaller is the amount?','tall')]),
          ('Apply',[('<b>Emma:</b> Design a pretend snack recipe with at least four measured ingredients. Circle each fraction and choose sensible tools.','xl'),('<b>Natalie:</b> Scale 3/4 cup oats, 2/3 cup milk, and 1 1/2 tablespoons honey from 1 batch to 1 1/2 batches. Show arithmetic and tools.','xl'),('Clean and dry tools. Name the measuring habit that mattered most today.','tall')])])

          # WEDNESDAY — Sep 2
          lesson('lessons/natalie-math-decimal-division.html','Decimal Division','Natalie · Math','Divide decimals using place value, equivalent quotients, and estimation instead of moving decimal points without meaning.',[
          'Decimal division is ordinary division with place value attached. Dividing by 0.4 asks how many four-tenths-sized groups fit, while dividing by 4 asks how many groups of four fit. Different group sizes must produce different quotients.',
          'To make a decimal divisor easier, multiply both dividend and divisor by the same power of ten. This creates an equivalent quotient because both quantities are scaled equally. For 7.2 ÷ 0.6, multiply both by 10: 72 ÷ 6 = 12.',
          'If the divisor is already a whole number, divide normally and keep place value visible. For 12.6 ÷ 3, estimate 12 ÷ 3 = 4, so an exact answer a little above 4 is reasonable.',
          'Estimate before calculating. Compatible numbers tell you the approximate size. An answer such as 0.042 or 420 should look suspicious if the estimate was about 4. In applications, label money, distance, mass, or unit rates.'
          ],[('dividend','quantity being divided'),('divisor','size or number of groups'),('equivalent quotient','a division expression scaled equally in dividend and divisor'),('compatible numbers','nearby numbers easy to divide mentally')],[
          '<b>Example 1:</b> 8.4 ÷ 0.7 → 84 ÷ 7 = 12.','<b>Example 2:</b> 15.75 ÷ 3 = 5.25; estimate 15 ÷ 3 = 5.','<b>Example 3:</b> $18.90 shared among 6 people gives $3.15 each.'
          ],[('Why can 7.2 ÷ 0.6 become 72 ÷ 6?','Both numbers were multiplied by 10, preserving the quotient.'),('Estimate 24.8 ÷ 4.9.','About 25 ÷ 5 = 5.'),('Should 6 ÷ 0.5 be greater or less than 6?','Greater; the exact quotient is 12.')],'<b>Strong work shows:</b> an estimate, equal scaling when needed, correct place value, units, and a reasonableness sentence.')
          practice('natalie-math-decimal-division-1.html','Decimal Division','Natalie · Math','Estimate first on application problems. Show how you create an equivalent quotient when the divisor is decimal.',[
          ('Place value and estimation',[('Estimate 19.6 ÷ 4.1 with compatible numbers.','tall'),('Explain why 8 ÷ 0.5 is larger than 8 ÷ 5.','tall'),('Rewrite 6.72 ÷ 0.8 with a whole-number divisor.','tall')]),
          ('Calculate',['14.4 ÷ 6','7.2 ÷ 0.6','18.75 ÷ 2.5','5.46 ÷ 0.7','42.84 ÷ 1.2']),
          ('Applications',[('$27.30 is split equally among 6 people. Find each share.','tall'),('A 12.6-meter roll is cut into 0.9-meter pieces. How many pieces? Check by multiplication.','tall'),('A car travels 186.3 miles on 6.9 gallons. Estimate then find miles per gallon to the nearest tenth.','tall')]),
          ('Analyze',[('A student changes 4.8 ÷ 0.6 to 48 ÷ 0.6. Explain why that changes the quotient and fix it.','tall'),('Which is greater: 9.6 ÷ 0.8 or 9.6 ÷ 1.2? Explain before calculating.','tall'),('Create a decimal-division unit-rate situation. Solve and label units.','xl')])])

          lesson('lessons/emma-math-coordinate-distance.html','Horizontal & Vertical Distance','Emma · Math','Find horizontal and vertical distances on a coordinate plane, including across zero, and explain why distance is always nonnegative.',[
          'Two points on the same horizontal line have equal y-coordinates. Their distance comes from the x-coordinates. Two points on the same vertical line have equal x-coordinates, so their distance comes from the y-coordinates.',
          'Distance tells how far apart points are, not which direction you traveled. It is never negative. From x=-4 to x=3, move 4 units to zero and 3 more to 3: 7 units total.',
          'You can also subtract and use the positive size of the difference. For (-4,2) and (3,2), the horizontal separation is 7. Plotting is a useful check when negative coordinates feel confusing.',
          'For a route made of horizontal and vertical segments, find each segment separately and add. Keep track of which coordinate stays the same so you do not accidentally measure a diagonal as if it were horizontal or vertical.'
          ],[('horizontal','left-to-right; same y-coordinate'),('vertical','up-and-down; same x-coordinate'),('distance','nonnegative space between locations'),('segment','a straight part of a route')],[
          '<b>Example 1:</b> (-5,3) to (2,3) is 7 units horizontally.','<b>Example 2:</b> (4,-6) to (4,1) is 7 units vertically.','<b>Example 3:</b> (-2,1) → (5,1) → (5,-3) is 7 + 4 = 11 units.'
          ],[('Points (2,5) and (2,-3) form what kind of segment?','Vertical.'),('Why is distance from -6 to -2 equal to 4, not -4?','Distance measures size of separation.'),('What must be true before using only x-values for distance?','The y-coordinates must match.')],'<b>Strong work shows:</b> correct points, horizontal/vertical recognition, careful counting across zero, and units in context.')
          practice('emma-math-coordinate-distance-1.html','Horizontal & Vertical Distance','Emma · Math','Draw or use a coordinate plane when helpful. Show how you counted or subtracted.',[
          ('Same-line distances',[('Distance between (-4,2) and (5,2). Explain why horizontal.','tall'),('Distance between (3,-6) and (3,4).','tall'),('Distance between (-7,-3) and (-2,-3).','tall'),('Distance between (0,5) and (0,-4).','tall')]),
          ('Plot and reason',[('Plot A(-5,4), B(2,4), C(2,-2). Find AB, BC, and total route A→B→C.','xl'),('Create two points 8 units apart horizontally that are both in Quadrant III.','tall'),('Create two points 6 units apart vertically on opposite sides of the x-axis.','tall')]),
          ('Situations',[('Treasure (-3,1) and key (4,1): how far apart and which coordinate stays the same?','tall'),('A robot travels (-2,-4) to (-2,3), then to (5,3). Find total distance.','tall'),('Explain the error: distance from x=-5 to x=2 is -7.','tall')]),
          ('Challenge',[('Draw an axis-aligned rectangle with integer-coordinate vertices and find its perimeter.','xl'),('Explain why a negative coordinate can still be part of a positive distance.','tall')])])

          lesson('lessons/emma-la-paragraph.html','Add Strong Details','Emma · Language Arts','Choose specific details that help a reader picture, understand, or believe the main idea of a paragraph.',[
          'A detail is useful when it does a job. It can help the reader picture a scene, understand what happened, or see why a main idea is true. Adding random adjectives does not automatically make writing stronger.',
          'Compare “The dog was funny” with “The dog carried one sock to the door and waited as if it were a leash.” The second sentence gives a concrete action so the reader can see why the dog seems funny.',
          'Strong details often use specific nouns and verbs. “The bird moved” can become “The robin hopped along the fence.” You do not need giant vocabulary words; you need accurate ones.',
          'Good writers remove details that pull away from the main idea. If a paragraph is about why a storm canceled a picnic, the blanket color probably does not matter unless it connects to the point.'
          ],[('specific','exact enough to create a clear idea'),('detail','information developing a main idea'),('relevant','connected to the paragraph’s purpose'),('revise','change writing to make ideas stronger or clearer')],[
          '<b>Vague:</b> “The room was messy.” <b>Specific:</b> “Shoes blocked the doorway and open boxes covered the floor.”','<b>Weak verb:</b> “The squirrel went across the branch.” <b>Stronger:</b> “The squirrel scrambled across the branch.”','<b>Relevant detail:</b> for a difficult hike, steep hills and loose rocks matter more than a backpack color.'
          ],[('Which is stronger: “The soup was hot” or “Steam fogged my glasses”?','The second gives an observable detail.'),('Should every sentence have many adjectives?','No; precise nouns, verbs, and facts are more useful.'),('What revision question helps test a detail?','How does this help the reader understand my main idea?')],'<b>Strong work shows:</b> concrete details, accurate verbs, a clear main idea, and removal of vague or unrelated information.')
          practice('emma-la-paragraph-1.html','Add Strong Details','Emma · Language Arts','Revise for specificity. Do not make sentences longer just to make them longer.',[
          ('Make it specific',[('Rewrite “The cat did something funny” with one clear action.','tall'),('Rewrite “We had bad weather” with at least two observable details.','tall'),('Replace the weak verb in “The horse went across the field” and explain why your verb fits.','tall')]),
          ('Pick useful details',[('Main idea: “The library is a good place to concentrate.” Write three supporting details.','tall'),('Which does not fit a difficult-bike-ride paragraph: steep hill, loose chain, purple helmet, strong wind? Explain.','tall'),('Main idea: “The puppy was nervous at the vet.” Show nervousness with two actions without using “nervous.”','tall')]),
          ('Expand and explain',[('Turn “The cake failed” into 3–4 strong sentences using observable details.','xl'),('Explain why this matters: “The map showed the trail ending at the river, but the bridge symbol was missing.”','tall')]),
          ('Write and revise',[('Write a 7–9 sentence paragraph about a place you know. Give one clear main idea and at least four supporting details.','xl'),('Underline two specific nouns/verbs, circle one improved sentence, and replace one vague word.','xl'),('Describe an ordinary object in three precise sentences without naming it.','tall')])])

          lesson('lessons/natalie-la-evidence.html','Use a Clue from the Text','Natalie · Language Arts','Make a claim about a text, select precise evidence, and explain how the evidence supports the claim.',[
          'Text evidence is not any sentence copied from a passage. Useful evidence is the detail that best supports the idea you are trying to prove. Start with the claim, then ask which exact words or event make you think it.',
          'You can quote a short phrase or paraphrase accurately. Either way, the next step is reasoning: explain how the clue connects to the claim. This prevents “claim + quote” responses with no explanation.',
          'Sometimes one clue is not enough. Two independent details can make an inference stronger, especially when they point in the same direction for different reasons. If evidence could support more than one interpretation, acknowledge uncertainty.',
          'Precision matters. “She was upset” is not evidence if that is your inference. Better evidence is an observable action such as “She folded the letter twice, put it in her pocket, and stopped answering questions.”'
          ],[('claim','the idea being argued or explained'),('evidence','specific text information supporting a claim'),('inference','a conclusion based on clues plus reasoning'),('paraphrase','accurately restating information in your own words')],[
          '<b>Clue:</b> “Luis checked the clock three times and kept his backpack on.” <b>Inference:</b> he may be eager or anxious to leave.','<b>Weak evidence:</b> “Luis wanted to leave.” That repeats the inference instead of citing an observed clue.','<b>Two-clue reasoning:</b> several details pointing the same way can increase confidence.'
          ],[('What comes after evidence?','Reasoning that explains the connection to the claim.'),('Is paraphrased evidence allowed?','Yes, if accurate and specific.'),('Why can two clues be stronger than one?','They can independently support the same conclusion.')],'<b>Strong work shows:</b> a clear claim, precise evidence, explanation, and careful words such as “suggests” when the text does not prove something directly.')
          practice('natalie-la-evidence-1.html','Use a Clue from the Text','Natalie · Language Arts','Separate what the text directly states from what you infer. Use specific evidence and explain the connection.',[
          ('Evidence or inference',[('“Maya placed the untouched sandwich back in the bag and pushed the bag away.” Write one direct observation and one reasonable inference.','tall'),('“The porch light was on at noon, newspapers stacked by the door, and no one answered.” Give two inferences; choose the better-supported one.','tall')]),
          ('Claim + evidence + reasoning',[('“Eli reread the directions, erased the first line, and began again more slowly.” Support the claim that Eli cares about accuracy.','tall'),('“Nora laughed with the group, but after everyone left she returned to the table and smoothed the torn photograph.” Infer feelings with two details.','tall'),('Explain why “The character is nervous because she is nervous” is circular and rewrite with observable evidence.','tall')]),
          ('Weigh evidence',[('Claim: “The town expected flooding.” Rank: sandbags outside stores; a child wore red boots; weather office issued a river warning. Explain.','tall'),('Why can a relevant clue still fail to prove a claim by itself?','tall')]),
          ('Apply',[('Science fair passage: Jalen straightens labels, takes a slow breath, explains before being asked, then writes a note afterward. Infer before/after feelings with two details.','xl'),('Write 6–8 sentences supporting “Jalen is prepared even though he may be nervous,” including evidence, reasoning, and one uncertainty.','xl'),('From your current book, state one inference, give two clues, and explain each.','xl')])])

          lesson('lessons/shared-science-net-force.html','What Changes Motion?','Emma + Natalie · Science','Combine forces, determine net force, and use it to predict whether an object’s motion can change.',[
          'Objects often have more than one force acting at once. Net force is the overall result after forces are combined. Forces in the same direction add; forces in opposite directions compete, so subtract the smaller from the larger and keep the stronger direction.',
          'If net force is zero, the forces are balanced. That does not mean the object must be stopped. A moving object can keep moving at constant speed and direction with zero net force. This connects directly to inertia.',
          'If net force is not zero, forces are unbalanced and velocity can change—the object may speed up, slow down, or change direction. Net-force direction tells the direction of the change, not necessarily the direction the object is already moving.',
          'Draw arrows when a situation is confusing. Direction represents force direction and arrow length can represent force size. A diagram helps prevent adding forces that actually oppose one another.'
          ],[('net force','combined overall force on an object'),('balanced forces','forces combining to zero net force'),('unbalanced forces','forces producing nonzero net force'),('velocity','speed with direction')],[
          '<b>Example 1:</b> 8 N right and 3 N left → 5 N right.','<b>Example 2:</b> 6 N left and 6 N right → 0 N; an already-moving object need not stop.','<b>Example 3:</b> A sled moving right with net force left can slow before possibly reversing.'
          ],[('10 N east and 4 N west gives what?','6 N east.'),('Can an object move while forces are balanced?','Yes, at constant velocity.'),('A ball moves right but net force points left. What may happen first?','It can slow.')],'<b>Strong work shows:</b> arrows/directions, correct addition or subtraction, newton units, and a prediction separating current motion from net-force direction.')
          practice('shared-science-net-force-1.html','What Changes Motion?','Emma + Natalie · Science','Draw force arrows for at least four problems. Include magnitude and direction in nonzero answers.',[
          ('Combine forces',['5 N right + 7 N right','9 N left and 4 N right','12 N forward and 12 N backward','15 N east and 6 N west']),
          ('Predict motion',[('A cart at rest gets 20 N right and 8 N left. Find net force and predict first motion change.','tall'),('A puck slides right; net force becomes 3 N left. Explain what can happen before assuming reversal.','tall'),('A bicycle moves steadily and forces become balanced. Does it instantly stop? Explain.','tall')]),
          ('Draw and explain',[('Box: 10 N right, 4 N left, 2 N left. Draw arrows and find net force.','xl'),('Invent two force combinations both producing 5 N right.','tall'),('A student adds 8 N right + 3 N left = 11 N right. Diagnose.','tall')]),
          ('Apply',[('<b>Emma:</b> Give one balanced and one unbalanced playground/household example and observable evidence.','xl'),('<b>Natalie:</b> An object moves west while net force points east. Give two possible velocity changes over time and explain why force direction is not always motion direction.','xl'),('Connect net force to Newton’s First Law/inertia in one sentence.','tall')])])

          lesson('lessons/shared-geography-map-skills.html','Map Skills','Emma + Natalie · Geography','Use map title, legend, direction, scale, and grid information, choose an appropriate map, and recognize every map has a purpose and limits.',[
          'A map is a model of a place. The real world is too large and detailed to fit on paper, so a mapmaker chooses what to include, simplify, and symbolize. Start with the title because it tells what the map is meant to show.',
          'The legend or key explains symbols and colors. A compass rose or north arrow gives direction. A grid helps locate places precisely. Scale connects map distance to real distance, such as 1 inch = 20 miles.',
          'Different maps answer different questions. Physical maps emphasize landforms and water; political maps emphasize boundaries and places; thematic maps show one type of information such as rainfall, population, or crops. The best map depends on the question.',
          'Maps have limits. They can omit information, use old data, or distort shapes and sizes when a curved Earth is shown flat. Good readers ask who made the map, when, and for what purpose.'
          ],[('legend/key','explanation of map symbols and colors'),('scale','relationship between map and actual distance'),('thematic map','a map focused on one kind of information'),('grid','rows and columns for locating places'),('map projection','a method for representing curved Earth on a flat surface')],[
          '<b>Scale:</b> if 1 cm = 25 km, 4 cm represents 100 km.','<b>Map choice:</b> compare rainfall with a rainfall thematic map, not a highway map.','<b>Limit:</b> a population map from 1990 may be accurate for 1990 but poor evidence for current population.'
          ],[('Where do you check an unfamiliar map symbol?','The legend or key.'),('If 2 cm = 30 km, what does 5 cm represent?','75 km.'),('Why is there no single best map?','Different maps select information for different purposes.')],'<b>Strong work shows:</b> evidence from map features, units in scale work, correct direction language, and attention to purpose and limits.')
          practice('shared-geography-map-skills-1.html','Map Skills','Emma + Natalie · Geography','Use the fictional map information in each problem. Show scale calculations and explain map choice.',[
          ('Read map tools',[('Legend: ★ hospital, ▲ park, ● school. What symbol matters for emergency care and why is the legend necessary?','tall'),('North is up. The library is directly right of school. What direction is it?','tall'),('Grid columns A–F, rows 1–6; museum C4. Explain how grid references help.','tall')]),
          ('Scale',[('1 cm = 20 km; towns are 3.5 cm apart. Find real distance.','tall'),('2 inches = 50 miles; route is 5 inches. Find real distance.','tall'),('Correct: 4 cm on a 1 cm = 12 km map equals 16 km.','tall')]),
          ('Choose the map',[('Best for mountain ranges: political, physical, or population-density? Explain.','tall'),('Best for where corn is grown: road, physical, or crop-production thematic? Explain.','tall'),('Give one question a political map answers well and one it answers poorly.','tall')]),
          ('Reason',[('<b>Emma:</b> Design an imaginary park map with title, north arrow, five symbols, legend, and scale.','xl'),('<b>Natalie:</b> A “County Population, 2000” map is used to decide a 2026 clinic site. Identify two useful features and two limitations.','xl'),('Why is a map a model rather than a perfect copy?','tall')])])

          # THURSDAY — Sep 3
          lesson('lessons/natalie-math-choose-operation.html','Choose the Operation','Natalie · Math','Choose operations in rational-number problems by understanding relationships and units instead of relying on keyword tricks.',[
          'Word problems are not vocabulary quizzes. Words such as “each,” “left,” or “more” can occur with different operations. Start by identifying quantities, units, and the relationship the problem describes.',
          'Addition and subtraction combine or compare quantities with the same kind of unit. Multiplication often scales a quantity or creates a total from equal groups. Division can find group size, number of groups, or a unit rate.',
          'Fractions and decimals make answer-size predictions useful. Multiplying by a positive number less than 1 usually shrinks a quantity; dividing by one usually produces a larger quotient. Estimation can expose a wrong operation before arithmetic is finished.',
          'Multi-step problems need a plan. Write what each intermediate result means. If 18.6 ÷ 3 = 6.2, label it “6.2 miles per section” or the context’s actual unit. Units are clues to the next step.'
          ],[('operation','a mathematical action'),('unit rate','a rate for exactly one unit'),('scale','multiply a quantity by a factor'),('intermediate result','a meaningful result used in a later step')],[
          '<b>Example 1:</b> 3/4 cup per batch × 2 1/2 batches uses multiplication to scale.','<b>Example 2:</b> 5 1/4 miles split into 3/4-mile sections uses division to find number of groups.','<b>Example 3:</b> $24.60 for 6 identical items uses division to find dollars per item.'
          ],[('0.6 liter per pitcher for 4 pitchers: which operation?','Multiply.'),('4 1/2 yards cut into 3/4-yard pieces: which operation?','Divide.'),('Why is “more” not always an addition clue?','The relationship and units matter more than one word.')],'<b>Strong work shows:</b> operation choice explained before calculation, labeled units, a reasonableness estimate, and interpretation of the final result.')
          practice('natalie-math-rational-application-1.html','Choose the Operation','Natalie · Math','For each application, name the operation and give a one-sentence reason before calculating. Label units.',[
          ('Choose without solving',[('A 7.5-mile route is split into 5 equal sections. Name the operation and what the result means.','tall'),('A $48 jacket is discounted to 3/4 of original price. Name the operation and explain.','tall'),('A tank holds 12.8 gallons and 3.6 are used. Name the operation and explain.','tall'),('Temperatures differ by 17.5°. One is -4.2° and the other is warmer. Describe an operation to find it.','tall')]),
          ('Solve and check',[('2/3 cup flour per loaf for 7 loaves. How much flour?','tall'),('5 1/4 liters poured into 3/8-liter bottles. How many full bottles?','tall'),('$36.75 shared among 5 people. Each share?','tall'),('2.6 miles morning + 3 3/4 miles afternoon. Total?','tall')]),
          ('Multi-step',[('A 9.6-mile trail has 4 equal stages. Natalie walks 1.25 stages. How many miles? Label each step.','xl'),('3/4 cup rice makes 4 servings. How much for 10 servings? Use a unit rate or scale factor.','xl')]),
          ('Analyze',[('Give an example where the word “each” requires division, not multiplication.','tall'),('Create a two-step problem using a fraction or decimal. Solve, label units, and explain operation order.','xl')])])

          lesson('lessons/emma-math-coordinate-word.html','Coordinate Plane Word Problems','Emma · Math','Use coordinates, routes, and horizontal/vertical distances to solve real-world-style problems and explain what points mean.',[
          'Coordinates become useful when they represent locations. First decide what the axes mean and where the origin is. A point such as (-3,4) may mean 3 blocks west and 4 blocks north of a starting point.',
          'When a route stays horizontal or vertical, find each segment by comparing one coordinate at a time. Horizontal moves change x while y stays the same; vertical moves change y while x stays the same.',
          'Direction words matter. If positive x is east, negative x is west. Positive y can be north and negative y south. A negative coordinate does not mean negative distance; it tells which side of the origin a location occupies.',
          'Strong solutions include a sketch, ordered pairs, distance calculation, and a sentence answering the real question. If the problem asks which stop is closer, make the comparison—not just two separate calculations.'
          ],[('coordinate model','a graph representing real locations or quantities'),('route','a path through points'),('horizontal segment','endpoints share y'),('vertical segment','endpoints share x')],[
          '<b>Example:</b> Gate (-4,2) and bench (3,2) are 7 units apart.','<b>Route:</b> (1,-3) → (1,4) → (5,4) travels 7 + 4 = 11 units.','<b>Scale:</b> if each grid unit is 2 meters, 7 grid units represent 14 meters.'
          ],[('Same y-coordinate means what direct path?','Horizontal.'),('Why can (-6,2) be 9 units from (3,2)?','The separation crosses zero and totals 9.'),('One grid unit = 5 feet; 4 units = ?','20 feet.')],'<b>Strong work shows:</b> a labeled sketch, correct signs, segments calculated separately, scale applied when given, and a context sentence.')
          practice('emma-math-coordinate-word-1.html','Coordinate Plane Word Problems','Emma · Math','Sketch each situation before solving when the route has more than one segment.',[
          ('Map locations',[('Slide (-4,3), swings (2,3): how far apart?','tall'),('Fountain (5,-2), gate (5,4): find distance and name horizontal/vertical.','tall'),('A tree is 3 west and 5 north of origin. Give ordered pair and quadrant.','tall')]),
          ('Routes',[('Robot: (-2,1) → (4,1) → (4,-3). Draw route and find total.','xl'),('Game route: (3,-5) → (3,2) → (-1,2) → (-1,6). Find each segment and total.','xl'),('Create a three-segment route totaling exactly 15 units.','xl')]),
          ('Scale and compare',[('1 grid unit = 2 meters. Path (-3,0) to (5,0): real distance?','tall'),('Benches (-6,4), (1,4); fountain (-6,-1). Which is closer to first bench? Show both distances.','tall'),('Explain why x=-8 alone does not tell distance to every point on the y-axis.','tall')]),
          ('Design',[('Design a coordinate map with home base + four locations in at least three quadrants. Write and solve two route questions.','xl'),('Explain why coordinates can be negative while physical distance remains positive.','tall')])])

          lesson('lessons/emma-la-editing.html','Make Writing Clear','Emma · Language Arts','Revise sentences and short paragraphs for clear meaning by fixing vague words, confusing pronouns, repetition, order, and punctuation.',[
          'Editing is not only hunting spelling errors. Clear writing lets a reader know exactly who did what in an order that makes sense. Start with meaning: can the reader follow the idea without guessing?',
          'Pronouns such as he, she, it, they, and this need clear nouns. “When Ava handed Mia her notebook, she smiled” is confusing because “she” could mean Ava or Mia. Repeating a name once can be clearer than avoiding repetition at all costs.',
          'Vague words such as thing, stuff, nice, bad, went, and got can hide the exact idea. Replace them when a more precise noun or verb helps. Also remove repeated information that says the same thing twice.',
          'Finally check sentence boundaries and order. Correct sentences can still form a confusing paragraph when events are out of sequence. Revision may mean moving a sentence, combining two, or splitting a crowded one.'
          ],[('pronoun reference','the noun a pronoun points to'),('vague','not specific enough'),('redundant','unnecessarily repeated'),('sequence','logical or time order'),('revise','change ideas or wording for clarity')],[
          '<b>Confusing:</b> “Lena told Zoe that she lost the key.” → clarify who lost it.','<b>Vague:</b> “We got the thing and went there.” → “We picked up the library books and walked to checkout.”','<b>Redundant:</b> “The tiny, small kitten…” → choose one precise description.'
          ],[('What is unclear in “Sam gave Ben his coat”?','“His” could refer to Sam or Ben.'),('Should every vague word become a fancy word?','No, only a more exact word when useful.'),('If events are told B,C,A but happened A,B,C with no reason, what revision helps?','Reorder them logically.')],'<b>Strong work shows:</b> clear pronouns, specific nouns/verbs, repetition removed, logical order, and correct sentence boundaries.')
          practice('emma-la-editing-1.html','Make Writing Clear','Emma · Language Arts','Rewrite the full sentence or passage while preserving the intended meaning.',[
          ('Clear pronouns',[('Rewrite: “When Mia called Emma, she was already outside.” Make clear who was outside.','tall'),('Rewrite: “The dog chased the cat until it reached the porch.” Clarify which animal reached it.','tall'),('Explain why “Ava put the book beside the folder because it was torn” is confusing and fix it.','tall')]),
          ('Replace vague/repeated wording',[('Revise: “We went to the place and got some stuff for the project.”','tall'),('Remove repetition: “The small little box was tiny and small enough to fit in my pocket.”','tall'),('Strengthen verbs: “The squirrel went up the tree and then went across a branch.”','tall')]),
          ('Sentence and order',[('Fix: “I checked the weather it looked clear, we packed our bikes.”','tall'),('Put in logical order: hung wet coats; came in from rain; dried floor near door. Rewrite as paragraph.','tall')]),
          ('Full revision',[('Revise: “Maya had a thing to show Liv. She put it by her chair, she forgot about it. Later she saw the box and remembered the surprise gift. Maya gave it to her and she smiled.”','xl'),('Write 6–8 sentences about completing a task. Revise one pronoun, vague word, sentence boundary, and sequence/transition. Mark changes.','xl'),('Which revision made your paragraph easiest to understand and why?','tall')])])

          lesson('lessons/natalie-la-editing.html','Edit Your Sentences','Natalie · Language Arts','Edit sentence boundaries, clause connections, punctuation, concision, and parallel structure while preserving meaning.',[
          'Editing starts with structure. Find independent clauses—groups of words that could stand as complete sentences. Two independent clauses joined only by a comma create a comma splice; pushed together with no punctuation, they form a run-on.',
          'Choose the repair that matches the relationship: a period creates separation; a semicolon joins closely related complete ideas; a comma plus a coordinating conjunction can show contrast, cause, or result. Dependent clauses must attach to complete ideas.',
          'Clarity also depends on concision. Remove repetition, empty phrases, and wording that says the same thing twice. Concision does not mean making everything short; it means every word earns its place.',
          'Parallel structure helps lists and comparisons. “She likes hiking, to cook, and drawing” mixes forms. “She likes hiking, cooking, and drawing” is parallel. Read aloud to hear whether repeated structures match.'
          ],[('independent clause','a subject-verb group expressing a complete thought'),('dependent clause','a clause that cannot stand alone'),('comma splice','independent clauses joined with only a comma'),('concision','clear expression without unnecessary wording'),('parallel structure','matching grammatical forms')],[
          '<b>Comma splice:</b> “The storm passed, the roads stayed flooded.” → “The storm passed, but the roads stayed flooded.”','<b>Concision:</b> “At this point in time, we are currently ready.” → “We are ready now.”','<b>Parallel:</b> “The job requires measuring, cutting, and checking.”'
          ],[('Is “Although the road was closed.” complete?','No; “although” makes it dependent.'),('Two repairs for “I finished the draft, I still needed to revise”?','Use period/semicolon, or comma + but.'),('What is wrong with “collect food, helping neighbors, and a fundraiser”?','The list is not parallel.')],'<b>Strong work shows:</b> clause-aware punctuation, purposeful conjunctions, concise wording, parallel lists, and meaning preserved.')
          practice('natalie-la-editing-1.html','Edit Your Sentences','Natalie · Language Arts','Name the issue when asked and write a complete corrected version.',[
          ('Boundaries',[('Identify and repair: “The experiment worked, the measurements were inconsistent.”','tall'),('Repair: “Because the second source was written twenty years later.”','tall'),('Give two correct punctuations for “The first plan was cheaper it required a longer drive.” Explain tone difference.','tall')]),
          ('Concision and precision',[('Revise: “In my personal opinion, I think the ending was unexpected and surprising.”','tall'),('Revise: “The reason the bridge failed was because the center part in the middle bent downward.”','tall'),('Replace vague wording: “The source says some things that show the event was bad.”','tall')]),
          ('Parallel structure',[('Revise: “The committee needed to gather evidence, interviewing witnesses, and a written report.”','tall'),('Complete a parallel list: “A strong lab report should describe the question, ___, and ___.”','tall')]),
          ('Passage edit',[('Edit: “The witness remembered the storm clearly, she wrote her account many years later. Because memory can change. The record is still useful due to the fact that it gives details, but we should also compare it with other sources too.”','xl'),('Write 7–9 sentences about a decision/problem. Mark one boundary edit, concise rewrite, precise-word revision, and parallel-structure check.','xl'),('Explain one place where more than one punctuation choice was correct and why you chose yours.','tall')])])

          lesson('lessons/shared-social-perspective.html','Different Points of View','Emma + Natalie · Social Studies','Compare how people can describe the same event differently because of position, experience, purpose, timing, and access to information.',[
          'Two sources can disagree without one person automatically lying. People notice different details because they stand in different places, have different jobs, know different information, or care about different outcomes. Historians call this perspective.',
          'Perspective is not an excuse to accept every claim. Compare each source with other evidence. Ask who created it, when, what the person could directly observe, what they might have missed, and why they recorded the event.',
          'Agreement between independent sources can strengthen a claim, while disagreement can reveal what needs more investigation. A merchant may emphasize damaged goods; a city official may emphasize road closures; a child may remember frightening sounds. Different views can describe different parts of the same event.',
          'Purpose matters. A private diary, advertisement, official report, and campaign speech target different audiences. Purpose does not automatically make a source unreliable, but it helps explain emphasis and omissions.'
          ],[('perspective','viewpoint shaped by position, experience, and knowledge'),('purpose','why a source was created'),('audience','who the source was meant for'),('corroborate','compare independent evidence'),('limitation','what a source cannot reliably tell us')],[
          '<b>Example:</b> a worker inside a fire may describe smoke and evacuation while a reporter outside describes fire crews and roads.','<b>Purpose:</b> an advertisement may accurately name a product but exaggerate benefits.','<b>Comparison:</b> three independent sources agreeing a bridge closed at noon strengthen that detail.'
          ],[('Does a different perspective automatically make a source false?','No.'),('What identifies a source limitation?','Ask what the creator could directly know and what was outside their access.'),('Why does audience matter?','Writers select tone/details based on whom they want to inform or persuade.')],'<b>Strong work shows:</b> respectful comparison, specific evidence, observation vs interpretation, and careful claims about what each source can and cannot establish.')
          practice('shared-social-perspective-1.html','Different Points of View','Emma + Natalie · Social Studies','Use the fictional Harbor Festival source set. Treat each source as evidence with strengths and limits.',[
          ('Source set',[('<b>A — Vendor:</b> rain after noon; signs ruined; organizers told vendors to pack; lost sales.<br><b>B — Parks report:</b> lightning observed at 12:42; staff cleared field and closed festival for safety.<br><b>C — Visitor:</b> left before big storm because lines were long; saw people running toward parking lot from car.<br><b>D — Next-day promotion:</b> “Despite yesterday’s weather interruption, Harbor Weekend continues today with a full schedule!”','xl')]),
          ('Compare',[('What do A and B agree on, and what concerns differ?','tall'),('Why is C weak for establishing exact official closing time?','tall'),('What is D’s likely purpose/audience and how may that shape wording?','tall')]),
          ('Build claims',[('Claim: “Safety concerns, not only heavy rain, led organizers to close the field.” Best source and why?','tall'),('Write one claim supported by at least two independent sources.','tall'),('Name one question none of the sources can answer confidently and a new source that could help.','tall')]),
          ('Perspective and synthesis',[('<b>Emma:</b> Explain how vendor and visitor could both be truthful while remembering differently.','xl'),('<b>Natalie:</b> Compare B and D by purpose, audience, timing, and emphasis; choose best for safety reason.','xl'),('Why is “Source A cared about money so ignore it” too simple?','tall'),('Write a 6–8 sentence account using at least three sources, separating well-supported facts from uncertainty.','xl'),('Why is perspective useful information, not merely a problem?','tall')])])

          lesson('lessons/shared-art-shading.html','Shading: Light to Dark','Emma + Natalie · Art','Create a controlled value range and use light direction, gradual shading, highlights, core shadow, and cast shadow to make flat drawings look three-dimensional.',[
          'Value means how light or dark something appears. Artists use value changes to show form. A circle looks flat when it is one tone; it can look like a sphere when the side facing light stays brighter and the opposite side gradually darkens.',
          'Pressure matters. Start lightly and build darker values in layers. You can shade with smooth strokes, hatching, cross-hatching, or stippling. Technique can vary, but the value relationships still need to match the light source.',
          'Choose a light direction before shading. The highlight is the lightest area. The core shadow is a darker region on the form away from light. A cast shadow appears on the surface beside the object and generally extends away from the light source.',
          'Look at real objects rather than guessing. Squinting slightly can make the big light/dark shapes easier to see. Art practice is observation plus control, not filling every inch with pencil.'
          ],[('value','how light or dark a tone is'),('highlight','lightest area receiving strong light'),('core shadow','darker part turned away from light'),('cast shadow','shadow placed on another surface'),('gradient','a gradual change from one value to another')],[
          '<b>Value scale:</b> five boxes from paper white to darkest controlled pencil value.','<b>Sphere:</b> light from upper left means highlight upper-left, darker lower-right, cast shadow generally down/right.','<b>Common mistake:</b> dark outline plus even coloring shows a symbol of a ball, not light on form.'
          ],[('If light is on the left, which side is generally darker?','The right side.'),('Why build dark values in layers?','For better control and smoother transitions.'),('Which direction does cast shadow generally extend?','Away from the light source.')],'<b>Strong work shows:</b> at least five distinguishable values, a consistent light source, gradual shading, and deliberate technique.')
          practice('shared-art-value-study-1.html','Shading: Light to Dark','Emma + Natalie · Art','Use pencil and plain paper. Work from observation when possible. This is a drawing lab, not a writing worksheet.',[
          ('Control',[('Draw a five-box value scale from paper white to your darkest controlled value.','xl'),('Make a second 5-step scale using hatching or cross-hatching.','xl')]),
          ('Form study',[('Draw a large circle; show light from upper left; shade into a sphere with highlight, middle values, core shadow, cast shadow.','xl'),('Label highlight, light side, shadow side, and cast shadow.','tall'),('Compare with a real round object under a lamp/window. Name one match and one revision.','tall')]),
          ('Observe an object',[('Choose a mug, ball, box, or fruit. Make a 10-minute value sketch using at least four values.','xl'),('Circle darkest dark and lightest light. Do they match your chosen light direction? Explain.','tall')]),
          ('Extend',[('<b>Emma:</b> Redraw one section with a different shading technique. Which gives better control?','xl'),('<b>Natalie:</b> Add subtle reflected light on the shadow side and explain why it stays darker than the highlight.','xl'),('What changed most between your value scale and final object drawing? What would you practice next?','tall')])])

          # FRIDAY — Sep 4
          lesson('lessons/natalie-math-unit-rates.html','Unit Rates & Proportions','Natalie · Math','Use unit rates, equivalent ratios, tables, and proportional reasoning to compare situations and solve real problems.',[
          'A rate compares quantities with different units, such as 180 miles in 3 hours or $7.50 for 5 pounds. A unit rate tells the amount for exactly one unit. Dividing 180 miles by 3 hours gives 60 miles per hour.',
          'Proportional situations keep the same multiplicative relationship. If 2 notebooks cost $5, then 4 cost $10 because both quantities doubled. A table of equivalent ratios makes the pattern visible.',
          'Unit rates make comparisons fair. A larger package is not automatically a better deal; compare dollars per ounce or ounces per dollar. Use the same orientation for every option.',
          'A proportion says two ratios are equal. Before solving, ask whether the situation is actually proportional. A taxi fare with a fixed starting fee plus a per-mile charge is not simple proportionality because zero miles does not cost zero dollars.'
          ],[('rate','comparison of quantities with different units'),('unit rate','a rate per exactly 1 unit'),('ratio','comparison by division'),('proportional','having a constant multiplicative relationship'),('constant of proportionality','the fixed unit rate connecting proportional quantities')],[
          '<b>Example 1:</b> 12 oz for $3 → $0.25 per ounce.','<b>Example 2:</b> 150 miles in 2.5 hours → 60 mph.','<b>Example 3:</b> y=4x gives pairs (1,4),(2,8),(5,20); y/x stays 4.'
          ],[('A 6-pack costs $4.50. What operation finds dollars per item?','4.50 ÷ 6.'),('3 cups flour for 2 batches: cups per batch?','1.5 cups per batch.'),('How can a ratio table be tested for proportionality?','Check whether the unit rate stays constant.')],'<b>Strong work shows:</b> units attached to rates, consistent comparison direction, proportionality checked rather than assumed, and explanation of what the rate means.')
          practice('natalie-math-proportional-1.html','Unit Rates & Proportions','Natalie · Math','Show unit labels. When comparing choices, calculate the same kind of unit rate for each.',[
          ('Find unit rates',[('42 miles in 3.5 hours: miles per hour?','tall'),('$8.40 for 6 pounds apples: dollars per pound?','tall'),('135 pages in 9 minutes: pages per minute?','tall'),('5 cups paint cover 650 sq ft: square feet per cup?','tall')]),
          ('Compare',[('Store A: 18 oz cereal $5.22; Store B: 24 oz $6.72. Compare cost per ounce.','tall'),('Runner A 4.5 miles in 36 min; Runner B 6 miles in 51 min. Compare consistently.','xl')]),
          ('Proportions',[('2.5 cups rice for 8 servings. How much for 14?','tall'),('Map: 3 cm = 45 km. What does 7.5 cm represent?','tall'),('Table x:2,4,7; y:6,12,21. Is it proportional? Find constant.','tall'),('Table x:1,2,3; y:5,8,11. Is it proportional? Explain the pattern.','tall')]),
          ('Reason and create',[('Why is “both quantities increase” not enough to prove proportionality? Give a counterexample.','tall'),('Create a proportional cooking/travel/shopping situation with three equivalent pairs, unit rate, and equation.','xl'),('Why is a $4 starting fee + $2/mile not proportional?','tall')])])

          lesson('lessons/emma-math-coordinate-patterns.html','Coordinate Patterns','Emma · Math','Generate ordered pairs from simple rules, graph them, notice patterns, and explain how changes in x connect to changes in y.',[
          'A table can turn a rule into ordered pairs. If “y is 2 more than x,” choose x, add 2, and record (x,y). For x=-1, y=1, so the pair is (-1,1).',
          'Graphing several pairs helps you see a pattern. If the same amount is added to x to get y, the points line up in a steady way. Connect the rule, table, ordered pairs, and graph instead of treating them as separate tasks.',
          'Multiplication rules work similarly. If y=3x, then x-values -2,-1,0,1,2 produce y-values -6,-3,0,3,6. Negative inputs can produce negative outputs and x=0 may land at the origin.',
          'Check a pattern by testing a point. A point fits y=x+4 only if its y-coordinate is exactly 4 greater than x. Testing is a quick way to find table or graph errors.'
          ],[('rule','a direction connecting one value to another'),('input','the x-value chosen first'),('output','the y-value produced by the rule'),('ordered pair','matching input/output written (x,y)'),('pattern','a relationship changing predictably')],[
          '<b>Example 1:</b> y=x+2 with x=-2,0,3 gives (-2,0),(0,2),(3,5).','<b>Example 2:</b> y=2x with x=-2,-1,0,1,2 gives y=-4,-2,0,2,4.','<b>Check:</b> (3,8) fits y=x+5; (4,8) does not.'
          ],[('For y=x-3 and x=5, y=?','2.'),('Does (-2,-6) fit y=3x?','Yes.'),('Why graph more than one point?','Several points reveal the pattern and expose mistakes.')],'<b>Strong work shows:</b> accurate tables, x before y, negative-number care, plotted/labeled points, and description of how y changes as x changes.')
          practice('emma-math-coordinate-patterns-1.html','Coordinate Patterns','Emma · Math','For each rule, make a table before graphing. Label points clearly.',[
          ('Build pairs',[('Rule y=x+3. Find y for x=-3,-1,0,2,5 and list pairs.','tall'),('Rule y=2x. Find y for x=-3,-1,0,1,4.','tall'),('Rule y=x-4. Find three points including one negative y.','tall')]),
          ('Graph',[('Graph the five points from y=x+3. What do you notice?','xl'),('Graph the five points from y=2x. Describe how its pattern differs.','xl')]),
          ('Check and correct',[('Which fit y=x+2: (1,3),(2,5),(-2,0),(4,6)? Show checks.','tall'),('A y=3x table lists (2,5). Diagnose and correct.','tall'),('Explain how swapping x and y changes the graph of (2,-4).','tall')]),
          ('Apply',[('A game awards 4 points/token. Let x=tokens, y=points. Table 0–5 and graph.','xl'),('Create a rule using x plus/minus a number or a whole-number multiple. Give five pairs and graph.','xl'),('Describe what happens to y when x increases by 1 in your rule.','tall')])])

          lesson('lessons/emma-la-mixed.html','Language Arts Review & Apply','Emma · Language Arts','Review this week’s sentence, evidence, and detail skills, then combine them in a short piece of clear writing.',[
          'Today is a review, not a surprise test. Good writers reuse several skills at once: complete sentences, details that support a point, and clues from a text or situation when making an inference.',
          'First check sentence boundaries. Every sentence should express a complete thought. Fragments need missing information; run-ons need correct separation or joining. Punctuation should show where one complete idea ends and another begins.',
          'Next check support. If you make a claim or inference, give a specific clue. If you describe a scene or explain an idea, choose concrete details instead of vague words. Explain why a detail matters when the connection is not obvious.',
          'Finally revise for clarity. Pronouns should point to clear nouns, events should be in a sensible order, and repeated or vague wording should improve. Revision is where several small skills become one strong piece of writing.'
          ],[('review','look again at learned skills to use them together'),('evidence','specific clue supporting an idea'),('revision','changing writing to improve meaning'),('sentence boundary','where one complete sentence ends and another begins')],[
          '<b>Sentence:</b> “Because the rain stopped.” is a fragment; add a complete idea.','<b>Evidence:</b> repeated clock-checking and keeping a coat on can support an inference that someone expects to leave.','<b>Detail:</b> “The room was messy” becomes clearer with open boxes and shoes blocking the doorway.'
          ],[('What should happen after evidence?','Explain how the clue supports the idea.'),('One sign of a run-on?','Two complete thoughts joined incorrectly.'),('A useful revision question?','Can the reader tell exactly what I mean, and does every detail support my point?')],'<b>Strong work shows:</b> independent use of the week’s skills. A hard part is useful information for what to practice next; it does not erase what you learned.')
          practice('emma-la-mixed-1.html','Language Arts Review & Apply','Emma · Language Arts','Work independently first. This is a weekly evidence sample, not a high-stakes test. Show what you know and revise when asked.',[
          ('Sentences',[('Label and fix: “After the bus finally arrived.”','tall'),('Fix: “The trail was muddy we took the longer path.”','tall'),('Fix: “I found the missing page, it was under my notebook.”','tall')]),
          ('Evidence',[('“Jon zipped his coat, checked dark clouds, and moved chairs under the porch.” Make an inference and give two clues.','tall'),('Why is “Jon is worried because he is worried” not evidence-based reasoning?','tall')]),
          ('Details and clarity',[('Revise “The party was fun and there was good stuff” with two specific details.','tall'),('Clarify: “When Nora handed Lily her drawing, she smiled.”','tall'),('Replace one vague verb in “The dog went to the door and got the toy.”','tall')]),
          ('Combine skills',[('Lights flicker; Dad sets out flashlight and charges phone; branches bend in wind. Write 5–7 sentences explaining what the family may expect using two clues.','xl'),('Write 7–9 sentences about a small challenge you solved, with complete sentences and three concrete details. Mark one clarity revision.','xl'),('Which skill felt easiest this week and which needs more practice? Give a specific example.','tall')])])

          lesson('lessons/natalie-la-summary.html','Write a Clear Summary','Natalie · Language Arts','Write an objective summary that captures a text’s main idea and essential supporting points without copying, opinion, or minor-detail overload.',[
          'A summary is a compressed version of a text. It preserves the central idea and most important support while leaving out examples, repetition, and details that are interesting but unnecessary to understand the whole.',
          'Begin by identifying the main idea or central claim. Then group supporting details into larger ideas. If several sentences describe different kinds of storm damage, one summary sentence may combine them.',
          'Use your own wording. Paraphrasing shows understanding instead of copying phrases. Keep the summary objective: unless evaluation is requested, do not add “I think,” praise, criticism, or new information.',
          'Length depends on the source, but someone who did not read the original should still understand the essential point and sequence. If your version includes nearly every detail, you have retold rather than summarized.'
          ],[('summary','a shorter account of essential ideas'),('objective','focused on the source rather than personal opinion'),('main idea','the central point'),('supporting detail','information developing the main idea'),('paraphrase','accurately restating in new wording')],[
          '<b>Combine:</b> several examples of volunteers repairing trails → “Volunteers repaired storm-damaged trails throughout the park.”','<b>Too detailed:</b> every volunteer name, tool, and hour when the main idea is community repair.','<b>Too vague:</b> “Some stuff happened after a storm.” A summary still needs the central idea and key actions.'
          ],[('Should a summary include your opinion?','Not unless evaluation is requested.'),('What can you do with several details supporting one larger point?','Group them into a broader accurate sentence.'),('Summary vs retelling?','A summary selects essentials; a retelling often includes many details.')],'<b>Strong work shows:</b> central idea first, essential details grouped logically, accurate paraphrase, no unsupported additions, and a much shorter final version.')
          practice('natalie-la-summary-1.html','Write a Clear Summary','Natalie · Language Arts','Read the passage twice. First identify the central idea; then select only details needed to understand it.',[
          ('Read first',[('<b>River Garden Project:</b> For years, an empty lot beside the Riverbend library collected weeds and trash. Last spring, library staff invited neighbors to suggest new uses. Most proposals focused on a community garden. Volunteers cleared debris, tested soil, and built raised beds after learning the original ground contained poor-quality fill. A hardware store donated lumber while families brought seeds and tools. By midsummer, the beds held vegetables, herbs, and native flowers. The garden became a teaching space for lessons on insects, plant growth, and cooking. Organizers say it still needs regular watering and maintenance, and they plan two more beds next year.','xl')]),
          ('Select',[('State the central idea in one sentence.','tall'),('List four details important enough to consider for a summary.','tall'),('Identify two details that can be omitted without losing the main idea. Explain.','tall'),('Is the reason for raised beds essential or optional for a short summary? Defend your choice.','tall')]),
          ('Paraphrase',[('Paraphrase the sentence about donated lumber and family supplies.','tall'),('Combine the crop list into a broader accurate phrase.','tall')]),
          ('Draft and evaluate',[('Write a 4–5 sentence objective summary including original problem, response, result, and ongoing/future work.','xl'),('Revise any unnecessary copied wording into your own words.','tall'),('Explain why “I think this was an amazing project because gardens are fun” is not an objective opening; revise it.','tall'),('Write a 3–4 sentence summary of a chapter, article, or lesson from this week.','xl'),('Name one strategy you used to decide what to leave out.','tall')])])

          lesson('lessons/shared-science-friction.html','Friction Test','Emma + Natalie · Science','Explain friction as a contact force, design a fair surface comparison, collect repeated measurements, and use evidence to support a claim.',[
          'Friction is a contact force that resists sliding between surfaces. It acts opposite the direction surfaces move or try to move relative to each other. Friction can slow motion, prevent slipping, create grip, and produce heat.',
          'How much friction occurs depends on the surfaces and how strongly they press together. In a classroom test, surface material is easier to investigate. Keep the object, starting position, travel distance, and release or pull method the same.',
          'You can compare friction without expensive equipment. Slide the same object down the same-height ramp covered with different materials and measure how far it travels afterward. Or use a spring scale if you already own one.',
          'One trial can be affected by bumps, release mistakes, or measurement error. Repeat trials and look for a pattern. Say “In our test, felt produced shorter slide distances” rather than claiming one small setup proves a universal rule.'
          ],[('friction','contact force resisting relative sliding'),('controlled variable','a condition kept the same'),('trial','one repetition of an experiment'),('evidence','measurements supporting a claim'),('claim','a conclusion answering the investigation question')],[
          '<b>Fair test:</b> same block, same ramp height, same start line, different surface covering.','<b>Evidence:</b> cardboard 82,79,81 cm vs towel 31,35,33 cm shows a repeated difference.','<b>Overclaim:</b> distance is an outcome affected by the setup; it is not a direct force measurement in newtons.'
          ],[('Which direction does friction act relative to sliding?','Opposite the sliding or attempted sliding.'),('Why repeat trials?','To reveal a pattern and reduce influence of one unusual trial.'),('Can you change surface and ramp height together and identify one cause?','No.')],'<b>Strong work shows:</b> one intentional variable, repeated measurements, units, a data-supported claim, and honest limits.')
          practice('shared-science-friction-1.html','Friction Test','Emma + Natalie · Science','Use a safe parent-approved setup. Use the same object and setup for every surface. Do at least three trials per condition.',[
          ('Plan',[('Question: How does surface material affect slide distance? Identify independent variable, measured outcome, and four controls.','xl'),('Choose 3 safe surfaces and predict which will resist motion most. Explain.','tall'),('Describe exactly how you will release/move the object the same way each time.','tall')]),
          ('Collect',[('Surface 1: record three distances with units and average.','xl'),('Surface 2: record three distances with units and average.','xl'),('Surface 3: record three distances with units and average.','xl')]),
          ('Analyze',[('Rank surfaces from shortest average travel to longest. What does the pattern suggest?','tall'),('Identify an unusual trial, if any, and a possible experimental reason.','tall'),('Write a claim and support it with at least two actual measurements.','xl')]),
          ('Extend',[('<b>Emma:</b> Draw a bar graph of average travel distance for the three surfaces. Label axes/units.','xl'),('<b>Natalie:</b> Explain why shorter travel is indirect evidence of greater motion-resisting friction but not a direct newton measurement.','xl'),('Connect friction to net force while the object slides and slows.','tall')])])

          lesson('lessons/shared-project-paper-bridge.html','Paper Bridge Challenge','Emma + Natalie · Project','Use the engineering design cycle to plan, build, test, analyze, and improve a paper bridge under clear constraints.',[
          'Engineering is not “build once and hope.” Engineers define a problem, work within constraints, create a design, test it, examine failure, and improve the next version. A failed test is useful when you record what happened.',
          'Your challenge is to span a gap using limited paper and tape while supporting as much load as possible. Flat paper bends easily. Folding changes shape and can increase stiffness. Beams, tubes, pleats, triangles, and layers distribute forces differently.',
          'Before building, sketch at least two ideas and predict where each may bend. Choose one for Version 1. Add load gradually in the same place so comparisons are fair. Record the maximum load before major failure.',
          'Redesign one feature based on evidence rather than randomly changing everything. If the center sags, reinforce or reshape the span; if the ends slip, improve how it rests on supports. Connect the design change to measured performance.'
          ],[('constraint','a limit the design must follow'),('prototype','a testable version of a design'),('load','weight or force the bridge supports'),('failure point','where/how the structure stops meeting the goal'),('iteration','a new version changed using prior-test information')],[
          '<b>Shape:</b> accordion folds create ridges that can resist bending better than a flat sheet.','<b>Fair test:</b> same gap, material limit, load placement, and load steps for Version 1 and 2.','<b>Useful failure note:</b> “The center folded sharply at 18 washers” guides redesign better than “It broke.”'
          ],[('Why sketch before building?','To compare ideas and create a testable plan.'),('Why change one main feature in Version 2?','So performance differences can be linked to a design decision.'),('What makes the version comparison fair?','Keep gap, materials, load placement, and testing method consistent.')],'<b>Strong work shows:</b> planned constraints, two candidate ideas, measured testing, failure analysis, evidence-based redesign, and final comparison.')
          practice('shared-project-paper-bridge-1.html','Paper Bridge Challenge','Emma + Natalie · Project','Suggested materials: paper, limited tape, two equal supports, ruler, and repeatable loads such as coins or washers. Parent approves setup.',[
          ('Define and plan',[('Write exact constraints: gap width, sheets allowed, tape limit, and load type.','xl'),('Sketch Design A and B. Label folds/shapes and predicted weak points.','xl'),('Choose Version 1, explain why, and predict maximum load.','tall')]),
          ('Build Version 1',[('Build the first prototype and record any necessary construction change.','tall'),('Add load gradually. Record successful loads and first major-failure load.','xl'),('Describe where bending, twisting, slipping, tearing, or collapse began. Sketch if helpful.','xl')]),
          ('Redesign',[('Choose one main Version 2 change based on failure evidence. State reason before rebuilding.','tall'),('Build Version 2 with the same material constraints.','tall'),('Test Version 2 with same gap, placement, and load steps. Record results.','xl')]),
          ('Compare',[('Compare maximum loads. By how much did performance change?','tall'),('Was redesign successful? Use claim + evidence + reasoning even if worse.','xl'),('<b>Emma:</b> Draw strongest part of final bridge and label what the shape helped it do.','xl'),('<b>Natalie:</b> Calculate load supported per sheet for each version if possible. Does efficiency change your judgment?','xl'),('If you had a third iteration, what one change would you test next and what evidence led you there?','xl')])])
