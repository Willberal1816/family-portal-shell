name: Apply full Review portal patch

on:
  push:
    paths:
      - 'tools/patch_full_review.py'
      - '.github/workflows/apply-full-review.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply private full Review route
        run: python tools/patch_full_review.py
      - name: Verify generated portal changes
        run: |
          git diff --check index.html
          grep -q "function prepareReviewPayload(d)" index.html
          grep -q "async function loadEncryptedReviewPages(a)" index.html
          grep -q "Full Review Packet" index.html
          if grep -q "reviewHtml(a)+studentReviewDecisionHtml(a)" index.html; then
            echo "Summary-only Review route still present" >&2
            exit 1
          fi
      - name: Commit generated portal source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Portal already patched."
          else
            git commit -m "Render full Review Packet in student portal"
            git push
          fi
