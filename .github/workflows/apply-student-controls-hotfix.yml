name: Version student control script references

on:
  push:
    paths:
      - '.github/workflows/apply-student-controls-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache-bust shared student controls on every hosted page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          version='20260901-4'
          pages=sorted(Path('worksheets').rglob('*.html'))
          changed=[]
          missing=[]
          pat=re.compile(r'/family-portal-shell/worksheets/school-page-controls\.js(?:\?v=[^"\']*)?')
          replacement=f'/family-portal-shell/worksheets/school-page-controls.js?v={version}'
          for page in pages:
              s=page.read_text(encoding='utf-8',errors='replace')
              if 'school-page-controls.js' not in s:
                  missing.append(str(page))
                  continue
              n=pat.sub(replacement,s)
              if n!=s:
                  page.write_text(n,encoding='utf-8')
                  changed.append(str(page))
          if missing:
              raise SystemExit('Student pages missing shared controls: '+repr(missing))
          if not changed:
              raise SystemExit('No student page references needed versioning')
          print(f'Versioned shared controls on {len(changed)} student pages.')
          PY
      - name: Verify versioned references
        run: |
          python - <<'PY'
          from pathlib import Path
          bad=[]
          marker='school-page-controls.js?v=20260901-4'
          for page in Path('worksheets').rglob('*.html'):
              if marker not in page.read_text(encoding='utf-8',errors='replace'):
                  bad.append(str(page))
          if bad: raise SystemExit('Unversioned student pages: '+repr(bad))
          PY
      - name: Commit cache-busted page references
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add worksheets
          git commit -m "Cache-bust blank-page print safeguards"
          git push
