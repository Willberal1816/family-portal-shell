name: Publish portal-hosted student class Review

on:
  push:
    paths:
      - '.github/workflows/publish-current-review-packets.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Route Review entirely inside School Portal
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old_show="function showReviewFallback(a){if(!a)return;document.getElementById('app').innerHTML='<article class=\"card work\"><div class=\"lesson-kicker\">Review for '+esc(a.subject)+'</div><h2>'+esc(lessonTitle(a))+'</h2>'+reviewHtml(a)+'<div class=\"actions\"><button onclick=\"returnToDay()\">Back</button></div></article>'}"
          new_show="function studentReviewDecisionHtml(a){var x=advancementInfo(a);if(!x||!x.decision)return'';var d=String(x.decision),label=/hold/i.test(d)?'Keep Learning This':/reinforce/i.test(d)?'Move On + Keep Practicing':'Move On',h='<section class=\"review-panel\"><h3>Learning Decision</h3><div class=\"review-row\"><b>'+esc(label)+'</b></div>';if(x.reason)h+='<div class=\"review-row\">'+esc(x.reason)+'</div>';if(x.adjusted)h+='<div class=\"review-row\"><b>What comes next</b><div>'+esc(x.adjusted)+'</div></div>';return h+'</section>'}\nfunction showClassReview(a){if(!a)return;active=null;document.getElementById('app').innerHTML='<article class=\"card work\"><div class=\"lesson-kicker\">Class Review · '+esc(a.subject)+'</div><h2>'+esc(lessonTitle(a))+'</h2>'+reviewHtml(a)+studentReviewDecisionHtml(a)+'<div class=\"actions\"><button onclick=\"returnToDay()\">Back to School Portal</button></div></article>'}"
          old_open="function openReview(row){var a=findAssignment(row);if(!a)return;var u=reviewPacketUrl(a);if(u){window.open(u,'_blank');return}showReviewFallback(a)}"
          new_open="function openReview(row){var a=findAssignment(row);if(a)showClassReview(a)}"
          if old_show not in s: raise SystemExit('Review screen anchor not found')
          if old_open not in s: raise SystemExit('Direct Review Packet handler not found')
          s=s.replace(old_show,new_show,1).replace(old_open,new_open,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate no Google navigation from student Review
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          required=[
            'function showClassReview(a)',
            'function studentReviewDecisionHtml(a)',
            'function openReview(row){var a=findAssignment(row);if(a)showClassReview(a)}',
            'Back to School Portal',
            '>Review</button>',
          ]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Missing student Review markers: '+repr(missing))
          if 'var u=reviewPacketUrl(a);if(u){window.open(u' in s:
              raise SystemExit('Student Review still navigates to Review Packet URL')
          print('Portal-hosted student class Review validation passed.')
          PY
      - name: Commit portal-hosted student Review
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Keep student class Review inside School Portal'
          git push
