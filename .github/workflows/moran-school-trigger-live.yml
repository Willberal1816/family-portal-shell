name: Moran School Live Trigger

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/moran-school-trigger-live.yml'
  workflow_dispatch:
  schedule:
    - cron: '7,27,47 15-23 * * *'
    - cron: '17,37,57 15-23 * * *'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Deliver Moran School trigger
        env:
          TOKEN_GH_PAT: ${{ secrets.GH_PAT }}
          TOKEN_GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
          TOKEN_PAT: ${{ secrets.PAT }}
          TOKEN_USER_GITHUB_TOKEN: ${{ secrets.USER_GITHUB_TOKEN }}
          TOKEN_GH_USER_TOKEN: ${{ secrets.GH_USER_TOKEN }}
          TOKEN_PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          DEFAULT_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          local_date="$(TZ=America/Chicago date +'%Y-%m-%d')"
          local_hour="$(TZ=America/Chicago date +'%H')"
          local_minute="$(TZ=America/Chicago date +'%M')"

          if [ "$local_hour" -lt 11 ] || [ "$local_hour" -gt 17 ]; then
            echo "Outside Moran School window; no trigger emitted."
            exit 0
          fi

          if [ "$EVENT_NAME" = "push" ]; then
            phase="USER_CREDENTIAL_ALIAS_VERIFY"
          else
            case "$EVENT_SCHEDULE" in
              "17,37,57 15-23 * * *") phase="RETRY" ;;
              *) phase="PRIMARY" ;;
            esac
          fi

          auth_mode="default-bot"
          export GH_TOKEN="$DEFAULT_TOKEN"
          for candidate_name in GH_PAT GITHUB_PAT PAT USER_GITHUB_TOKEN GH_USER_TOKEN PERSONAL_ACCESS_TOKEN; do
            case "$candidate_name" in
              GH_PAT) candidate="$TOKEN_GH_PAT" ;;
              GITHUB_PAT) candidate="$TOKEN_GITHUB_PAT" ;;
              PAT) candidate="$TOKEN_PAT" ;;
              USER_GITHUB_TOKEN) candidate="$TOKEN_USER_GITHUB_TOKEN" ;;
              GH_USER_TOKEN) candidate="$TOKEN_GH_USER_TOKEN" ;;
              PERSONAL_ACCESS_TOKEN) candidate="$TOKEN_PERSONAL_ACCESS_TOKEN" ;;
            esac
            if [ -n "$candidate" ]; then
              export GH_TOKEN="$candidate"
              auth_mode="user-secret:$candidate_name"
              break
            fi
          done

          stamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          body="MORAN_HOMESCHOOL_REVIEW_TRIGGER date=$local_date time=$local_hour:$local_minute phase=$phase github_run_id=$RUN_ID timestamp=$stamp. Read and follow the CURRENT live Home Schooling Master Index and run the complete rolling Homeschool Daytime Review & Closeout workflow for all work eligible at this pass. Process each completed class immediately, publish its student Review as soon as reviewed, and preserve Assignment IDs and runtime state."

          gh api --method POST "repos/$REPO/issues/4/comments" -f body="$body" >/dev/null
          echo "Posted Moran trigger comment auth_mode=$auth_mode"
