name: Moran School Live Trigger

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/moran-school-trigger-live.yml'
  workflow_dispatch:
  schedule:
    - cron: '7,27,47 15-23 * * *'
    - cron: '17,37,57 15-23 * * *'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Deliver Moran School trigger
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          RUN_ID: ${{ github.run_id }}
          ANCHOR_COMMENT_ID: '5686617452'
        shell: bash
        run: |
          local_date="$(TZ=America/Chicago date +'%Y-%m-%d')"
          local_hour="$(TZ=America/Chicago date +'%H')"
          local_minute="$(TZ=America/Chicago date +'%M')"

          if [ "$local_hour" -lt 11 ] || [ "$local_hour" -gt 17 ]; then
            echo "Outside Moran School window; no trigger emitted."
            exit 0
          fi

          if [ "$EVENT_NAME" = "push" ]; then
            phase="ANCHOR_EDIT_VERIFY"
          else
            case "$EVENT_SCHEDULE" in
              "17,37,57 15-23 * * *") phase="RETRY" ;;
              *) phase="PRIMARY" ;;
            esac
          fi

          stamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          body="MORAN_HOMESCHOOL_REVIEW_TRIGGER date=$local_date time=$local_hour:$local_minute phase=$phase github_run_id=$RUN_ID timestamp=$stamp. Read and follow the CURRENT live Home Schooling Master Index and run the complete rolling Homeschool Daytime Review & Closeout workflow for all work eligible at this pass. Process each completed class immediately, publish its student Review as soon as reviewed, and preserve Assignment IDs and runtime state."

          gh api --method PATCH "repos/$REPO/issues/comments/$ANCHOR_COMMENT_ID" -f body="$body" >/dev/null
          echo "Updated persistent Moran user anchor comment."
