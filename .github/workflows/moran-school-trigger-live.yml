name: Moran School Live Trigger

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/moran-school-trigger-live.yml'
  workflow_dispatch:
  schedule:
    - cron: '7,27,47 15-23 * * *'
    - cron: '17,37,57 15-23 * * *'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe existing credential aliases without exposing values
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        shell: bash
        run: |
          for name in GMAIL_APP_PASSWORD GMAIL_PASSWORD SMTP_PASSWORD SMTP_USER GMAIL_USER GOOGLE_REFRESH_TOKEN GMAIL_REFRESH_TOKEN GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET; do
            eval "value=\${$name}"
            if [ -n "$value" ]; then
              echo "$name=present"
            else
              echo "$name=absent"
            fi
          done
