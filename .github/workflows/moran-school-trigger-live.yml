name: Moran School Trigger Bridge

on:
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 16-23 * * *'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Deliver external school trigger
        env:
          USER_TOKEN: ${{ secrets.GH_PAT }}
          DEFAULT_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          local_date="$(TZ=America/Chicago date +'%Y-%m-%d')"
          local_hour="$(TZ=America/Chicago date +'%H')"
          local_minute="$(TZ=America/Chicago date +'%M')"

          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ "$local_hour" -ge 11 ] && [ "$local_hour" -le 16 ]; then
              case "$local_minute" in
                07|27|47) phase="PRIMARY" ;;
                17|37|57) phase="RETRY" ;;
                *) echo "Unexpected Moran School schedule minute; no trigger emitted."; exit 0 ;;
              esac
            elif [ "$local_hour" -eq 17 ] && [ "$local_minute" = "07" ]; then
              phase="WATCHDOG"
            else
              echo "Outside Moran School local execution window; no trigger emitted."
              exit 0
            fi
          else
            if [ "$local_hour" -ge 11 ] && [ "$local_hour" -le 16 ]; then
              phase="PRIMARY"
            elif [ "$local_hour" -eq 17 ]; then
              phase="WATCHDOG"
            else
              echo "Outside Moran School local execution window; no trigger emitted."
              exit 0
            fi
          fi

          if [ -n "$USER_TOKEN" ]; then
            export GH_TOKEN="$USER_TOKEN"
            auth_mode="user"
          else
            export GH_TOKEN="$DEFAULT_TOKEN"
            auth_mode="fallback-bot"
          fi

          stamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          body="MORAN_HOMESCHOOL_REVIEW_TRIGGER date=$local_date time=$local_hour:$local_minute phase=$phase github_run_id=$RUN_ID timestamp=$stamp. Read and follow the CURRENT live Home Schooling Master Index and run the complete rolling Homeschool Daytime Review & Closeout workflow for all work eligible at this pass. Process each completed class immediately, publish its student Review as soon as reviewed, and preserve Assignment IDs and runtime state."

          gh api --method POST "repos/$REPO/issues/4/comments" -f body="$body" >/dev/null
          echo "Delivered Moran trigger auth_mode=$auth_mode phase=$phase"
