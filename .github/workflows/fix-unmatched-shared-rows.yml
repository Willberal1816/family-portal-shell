name: One-time unmatched shared-session guard repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-unmatched-shared-rows.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch unmatched Shared row handling
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          replacement = r'''function collapseSharedClasses(items,preferredStudent){var arr=items||[],out=[],groups={},seen={},wanted=String(preferredStudent||'').trim().toLowerCase();arr.forEach(function(a){var key=sharedDisplayKey(a);if(key)(groups[key]||(groups[key]=[])).push(a)});arr.forEach(function(a){var key=sharedDisplayKey(a);if(!key){out.push(a);return}var g=groups[key]||[],students={};g.forEach(function(x){var s=String(x&&x.student||'').trim().toLowerCase();if(s)students[s]=1});if(Object.keys(students).length<2){var own=String(a&&a.student||'').trim().toLowerCase();if(!wanted||own===wanted)out.push(a);return}if(seen[key])return;var pick=null;if(wanted){for(var i=0;i<g.length;i++){if(String(g[i]&&g[i].student||'').trim().toLowerCase()===wanted){pick=g[i];break}}}out.push(pick||g[0]);seen[key]=1});return out}'''
          pattern = r"function collapseSharedClasses\(items,preferredStudent\)\{.*?\}\nfunction "
          new_text, count = re.subn(pattern, replacement + '\nfunction ', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected exactly one collapseSharedClasses block; found {count}')
          if 'Object.keys(students).length<2' not in new_text or 'own===wanted' not in new_text:
              raise SystemExit('Defensive unmatched-Shared guard missing after patch')
          p.write_text(new_text, encoding='utf-8')
      - name: Validate and commit
        run: |
          git diff --check
          grep -q 'Object.keys(students).length<2' index.html
          grep -q 'own===wanted' index.html
          git config user.name 'Willberal1816'
          git config user.email 'rmoran4446@mac.com'
          git add index.html
          git commit -m 'Prevent unmatched shared classes crossing student schedules'
          git push
