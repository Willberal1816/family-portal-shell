name: Moran School Fresh Thread Test

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Create fresh external trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          stamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          title="[MORAN SCHOOL TRIGGER] VERIFY FRESH THREAD $RUN_ID"
          body="@Willberal1816 MORAN_HOMESCHOOL_REVIEW_TRIGGER phase=PRIMARY_MANUAL_VERIFY github_run_id=$RUN_ID timestamp=$stamp. Read and follow the CURRENT live Home Schooling Master Index and run the complete Homeschool Daytime Review & Closeout workflow for all work eligible at this pass. Image-only scans are normal evidence. Preserve Assignment IDs and runtime state."
          gh api --method POST "repos/$REPO/issues" -f title="$title" -f body="$body" >/dev/null
          echo "Created fresh trigger issue for $RUN_ID."
