name: Patch student lesson feedback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-student-feedback.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch and validate feedback flow
        env:
          NATALIE_BACKEND: https://script.google.com/macros/s/AKfycbxe1gF7EQzRy_gu0TfHI2AFfvLAalOmcImu8Lv7mJ-lG7gib1DWULFkvj5J8XHioRKBZg/exec
          PATCH_B64: 
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, concurrent.futures, json, os, time, urllib.parse, urllib.request

          backend = os.environ['NATALIE_BACKEND']

          def call_feedback(payload):
              params = {'api':'feedback','row':'31','feedback':json.dumps(payload,separators=(',',':')),'callback':'x'}
              url = backend + '?' + urllib.parse.urlencode(params)
              for _ in range(3):
                  try:
                      raw = urllib.request.urlopen(url, timeout=20).read().decode().strip()
                      return json.loads(raw[2:-2]) if raw.startswith('x(') else {'ok':False,'error':'Unexpected backend response'}
                  except Exception as exc:
                      last = exc
                      time.sleep(.5)
              return {'ok':False,'error':'HTTP probe failed: '+repr(last)}

          phrases = [
              'I had enough information','I had enough information before the work','I had enough information before I started the work','I had enough teaching','I had enough teaching before the work','I had what I needed','I had what I needed before the work','I was ready','I was ready for the work','I was ready to do the work','I felt ready','I felt ready for the work','I knew what to do','I knew how to do the work','I understood the lesson','I understood what to do','I could do the work','I could do the work on my own','the teaching was enough','the lesson was enough','the lesson taught me enough','the lesson prepared me','the lesson prepared me for the work','the teaching prepared me','the teaching prepared me for the work','the teaching gave me enough information','the teaching gave me enough information before the work','the lesson gave me enough information','the lesson gave me enough information before the work','I got enough information','I got enough teaching','I got what I needed','I learned enough before the work','I did not need more teaching','I did not need extra teaching'
          ]
          candidates = ['Yes','Enough','I had enough information','The teaching gave me enough information before the work'] + [p+q for p in ['Yes - ','Yes — ','Yes, ','Yes: '] for q in phrases]

          def probe(v):
              r = call_feedback({'difficulty':'About right','teachingEnough':v})
              return v, r.get('error','')

          positive = None
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as ex:
              for value, error in ex.map(probe, candidates):
                  if error and error != 'Tell us whether the lesson taught you enough.':
                      positive = value
                      break
          if not positive:
              raise SystemExit('Could not resolve positive Teaching Enough value; no portal change made.')
          print('Resolved positive teaching value:', positive)

          r = call_feedback({'difficulty':'About right','teachingEnough':positive,'whatToFix':['Nothing was confusing']})
          fix_mode = 'array'
          if r.get('error') != 'Choose what would help next time.':
              r = call_feedback({'difficulty':'About right','teachingEnough':positive,'whatToFix':'Nothing was confusing'})
              fix_mode = 'string'
          if r.get('error') != 'Choose what would help next time.':
              raise SystemExit('Could not resolve What To Fix payload shape; no portal change made. Last error: '+str(r.get('error')))
          print('Resolved What To Fix mode:', fix_mode)

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = "window.addEventListener('hashchange',function(){backend='';init()});init();"
          if marker not in text:
              raise SystemExit('Portal init marker not found; refusing unsafe patch.')
          if 'function showClassFeedback(a,intro)' in text:
              print('Feedback patch already present; nothing to do.')
              raise SystemExit(0)

          patch = base64.b64decode(os.environ['PATCH_B64']).decode('utf-8')
          patch = patch.replace('__POSITIVE__', json.dumps(positive)).replace('__FIXMODE__', json.dumps(fix_mode))
          text = text.replace(marker, patch + '\n' + marker)
          path.write_text(text, encoding='utf-8')
          updated = path.read_text(encoding='utf-8')
          required = ['function showClassFeedback(a,intro)','Finish Class Feedback',"api('feedback'",'Feedback Pending','studentFeedbackSubmitted']
          missing = [x for x in required if x not in updated]
          if missing or updated.count(marker) != 1:
              raise SystemExit('Patch validation failed: '+repr(missing))
          print('Portal patch validation passed.')
          PY

      - name: Commit portal repair
        run: |
          git config user.name 'Willberal1816'
          git config user.email '204775082+Willberal1816@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No portal change needed.'
            exit 0
          fi
          git commit -m 'Restore student lesson feedback prompts'
          git push
