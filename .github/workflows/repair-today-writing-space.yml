name: One-time handwriting space repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-today-writing-space.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair today's worksheet response space
        shell: python
        run: |
          from pathlib import Path

          def rep(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'Expected text not found in {path}: {old[:80]}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          lined="background:repeating-linear-gradient(to bottom,#fff 0,#fff 27px,#d6dce5 28px)"

          rep('worksheets/curriculum/natalie-math-fraction-division-2.html',
              '.answer{height:54px;border-bottom:1px solid #9aa5b5;margin-top:8px}.answer.tall{height:95px}.answer.xl{height:150px}',
              f'.answer{{min-height:78px;border:1px solid #9aa5b5;border-radius:8px;margin-top:8px;padding:6px;{lined}}}.answer.tall{{min-height:130px}}.answer.xl{{min-height:320px}}')
          rep('worksheets/curriculum/natalie-math-fraction-division-2.html','@media print{body{background:#fff;padding:0}main{border:0;padding:0}.q{break-inside:auto}}','@media print{body{background:#fff;padding:0}main{border:0;padding:0}.q{break-inside:auto}.answer{break-inside:auto}}')

          rep('worksheets/curriculum/emma-math-coordinate-interpret-1.html',
              '.answer{min-height:54px;border:1px solid #9aa5b5;border-radius:8px;margin-top:8px;padding:6px}.answer.tall{min-height:95px}',
              f'.answer{{min-height:82px;border:1px solid #9aa5b5;border-radius:8px;margin-top:8px;padding:6px;{lined}}}.answer.tall{{min-height:140px}}')

          rep('worksheets/curriculum/emma-la-paragraph-1.html',
              '.answer{height:54px;border-bottom:1px solid #9aa5b5;margin-top:8px}.answer.tall{height:95px}.answer.xl{height:150px}',
              f'.answer{{min-height:96px;border:1px solid #9aa5b5;border-radius:8px;margin-top:8px;padding:6px;{lined}}}.answer.tall{{min-height:150px}}.answer.xl{{min-height:430px}}')
          rep('worksheets/curriculum/emma-la-paragraph-1.html','@media print{body{background:#fff;padding:0}main{border:0;padding:0}button{display:none}details>div{display:block}}','@media print{body{background:#fff;padding:0}main{border:0;padding:0}button{display:none}details>div{display:block}.q{break-inside:auto}.answer{break-inside:auto}}')

          rep('worksheets/curriculum/emma-reading-response.html',
              '.answer{height:54px;border-bottom:1px solid #9aa5b5;margin-top:8px}.answer.tall{height:95px}.answer.xl{height:150px}',
              f'.answer{{min-height:96px;border:1px solid #9aa5b5;border-radius:8px;margin-top:8px;padding:6px;{lined}}}.answer.tall{{min-height:165px}}.answer.xl{{min-height:430px}}')
          rep('worksheets/curriculum/emma-reading-response.html','@media print{body{background:#fff;padding:0}main{border:0;padding:0}button{display:none}details>div{display:block}}','@media print{body{background:#fff;padding:0}main{border:0;padding:0}button{display:none}details>div{display:block}.q{break-inside:auto}.answer{break-inside:auto}}')

          rep('worksheets/curriculum/natalie-reading-response.html',
              '.answer{height:54px;border-bottom:1px solid #9aa5b5;margin-top:8px}.answer.tall{height:95px}.answer.xl{height:150px}',
              f'.answer{{min-height:90px;border:1px solid #9aa5b5;border-radius:8px;margin-top:8px;padding:6px;{lined}}}.answer.tall{{min-height:175px}}.answer.xl{{min-height:430px}}')
          rep('worksheets/curriculum/natalie-reading-response.html','@media print{body{background:#fff;padding:0}main{border:0;padding:0}button{display:none}details>div{display:block}}','@media print{body{background:#fff;padding:0}main{border:0;padding:0}button{display:none}details>div{display:block}.q{break-inside:auto}.answer{break-inside:auto}}')

          rep('worksheets/curriculum/emma-social-evidence-proof-mastery-work-2.html',
              '.answer{min-height:66px;border:1px solid #8b96a3;border-radius:7px;margin-top:8px}.four{display:grid;grid-template-columns:1fr 1fr;gap:6px}.four div{border:1px solid #8b96a3;min-height:62px;padding:7px}',
              f'.answer{{min-height:115px;border:1px solid #8b96a3;border-radius:7px;margin-top:8px;padding:6px;{lined}}}.four{{display:grid;grid-template-columns:1fr 1fr;gap:6px}}.four div{{border:1px solid #8b96a3;min-height:105px;padding:7px}}')
          rep('worksheets/curriculum/emma-social-evidence-proof-mastery-work-2.html','style="min-height:95px"','style="min-height:180px"')
          rep('worksheets/curriculum/emma-social-evidence-proof-mastery-work-2.html','style="min-height:90px"','style="min-height:160px"')

          for path, height in [
              ('worksheets/curriculum/emma-science-net-force-mastery-work-2.html',140),
              ('worksheets/curriculum/natalie-science-net-force-mastery-work-2.html',130),
              ('worksheets/curriculum/natalie-la-clause-decision-recheck-work-4.html',105),
              ('worksheets/curriculum/natalie-geography-direction-purpose-mastery-work.html',100),
          ]:
              p=Path(path); s=p.read_text(encoding='utf-8')
              import re
              ns,n=re.subn(r'\.work\{min-height:\d+px;border:1px solid #888;margin-top:5px\}',f'.work{{min-height:{height}px;border:1px solid #888;border-radius:6px;margin-top:5px;padding:6px;{lined}}}',s,count=1)
              if n!=1: raise SystemExit(f'Expected work style not found in {path}')
              p.write_text(ns,encoding='utf-8')

      - name: Validate changed worksheets
        run: |
          git diff --check
          grep -q 'min-height:430px' worksheets/curriculum/emma-la-paragraph-1.html
          grep -q 'min-height:165px' worksheets/curriculum/emma-reading-response.html
          grep -q 'min-height:175px' worksheets/curriculum/natalie-reading-response.html
          grep -q 'min-height:140px' worksheets/curriculum/emma-science-net-force-mastery-work-2.html
          grep -q 'min-height:130px' worksheets/curriculum/natalie-science-net-force-mastery-work-2.html
          grep -q 'min-height:105px' worksheets/curriculum/natalie-la-clause-decision-recheck-work-4.html
          git config user.name 'Willberal1816'
          git config user.email 'rmoran4446@mac.com'
          git add worksheets/curriculum/natalie-math-fraction-division-2.html \
                  worksheets/curriculum/emma-math-coordinate-interpret-1.html \
                  worksheets/curriculum/emma-la-paragraph-1.html \
                  worksheets/curriculum/emma-reading-response.html \
                  worksheets/curriculum/natalie-reading-response.html \
                  worksheets/curriculum/emma-social-evidence-proof-mastery-work-2.html \
                  worksheets/curriculum/emma-science-net-force-mastery-work-2.html \
                  worksheets/curriculum/natalie-science-net-force-mastery-work-2.html \
                  worksheets/curriculum/natalie-la-clause-decision-recheck-work-4.html \
                  worksheets/curriculum/natalie-geography-direction-purpose-mastery-work.html
          git commit -m 'Give today worksheets handwriting-sized response space'
          git push