name: Fix student Review button

on:
  push:
    paths:
      - '.github/workflows/fix-student-review-button.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Route student Review buttons to Review Packet
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('index.html')
          s = page.read_text(encoding='utf-8')

          anchor = "function previewWork(row){var a=findAssignment(row);if(a)showWork(a)}"
          helpers = """function previewWork(row){var a=findAssignment(row);if(a)showWork(a)}
function reviewPacketUrl(a){return String(advField(a,'reviewPacket','Review Packet')||advField(a,'reviewPacketUrl','Review Packet URL')||'').trim()}
function showReviewFallback(a){if(!a)return;document.getElementById('app').innerHTML='<article class=\"card work\"><div class=\"lesson-kicker\">Review for '+esc(a.subject)+'</div><h2>'+esc(lessonTitle(a))+'</h2>'+reviewHtml(a)+'<div class=\"actions\"><button onclick=\"returnToDay()\">Back</button></div></article>'}
function openReview(row){var a=findAssignment(row);if(!a)return;var u=reviewPacketUrl(a);if(u){window.open(u,'_blank');return}showReviewFallback(a)}"""

          if 'function openReview(row)' not in s:
              if anchor not in s:
                  raise SystemExit('Could not find previewWork anchor')
              s = s.replace(anchor, helpers, 1)

          old = "onclick=\"previewWork('+a.row+')\">View Review</button>"
          count = s.count(old)
          if count < 1:
              raise SystemExit('Could not find any View Review button handlers')
          s = s.replace(old, "onclick=\"openReview('+a.row+')\">Review</button>")

          if 'View Review' in s:
              raise SystemExit('A View Review label remains after patch')
          if "onclick=\"openReview('+a.row+')\">Review</button>" not in s:
              raise SystemExit('Review button was not wired to openReview')
          if "advField(a,'reviewPacket','Review Packet')" not in s:
              raise SystemExit('Review Packet field lookup is missing')

          page.write_text(s, encoding='utf-8')
          print(f'Updated {count} student review button path(s).')
          PY
      - name: Validate review routing and existing class-flow safeguards
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks={
              'Review label':'View Review' not in s,
              'Review handler':'function openReview(row)' in s,
              'Review Packet field':"advField(a,'reviewPacket','Review Packet')" in s,
              'Finish Class':'Finish Class' in s,
              'Student Feedback':'Student Lesson Feedback' in s,
              'Back to School Portal':'Back to School Portal' in s,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('Portal validation failed: '+', '.join(bad))
          print('Student review routing validation passed.')
          PY
      - name: Commit student review repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Open student Review buttons to daily Review Packet"
          git push
