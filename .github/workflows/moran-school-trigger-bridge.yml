name: Moran School Trigger Bridge

on:
  workflow_dispatch:
    inputs:
      mode:
        description: test or live
        required: true
        default: test
        type: choice
        options:
          - test
          - live
      phase:
        description: PRIMARY or RETRY
        required: true
        default: PRIMARY
        type: choice
        options:
          - PRIMARY
          - RETRY
  schedule:
    - cron: '5 15-23 * * *'
    - cron: '35 15-23 * * *'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Deliver external school trigger
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_PHASE: ${{ inputs.phase }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          local_date="$(TZ=America/Chicago date +'%Y-%m-%d')"
          local_hour="$(TZ=America/Chicago date +'%H')"

          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ "$local_hour" -lt 11 ] || [ "$local_hour" -gt 17 ]; then
              echo "Outside Moran School window in America/Chicago; no notification emitted."
              exit 0
            fi
            mode="live"
            case "$EVENT_SCHEDULE" in
              35*) phase="RETRY" ;;
              *) phase="PRIMARY" ;;
            esac
          else
            mode="$INPUT_MODE"
            phase="$INPUT_PHASE"
          fi

          stamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          if [ "$mode" = "test" ]; then
            target=1
            body="@Willberal1816 MORAN SCHOOL TRIGGER TEST only. timestamp=$stamp phase=$phase github_run_id=$RUN_ID. Work must ignore this TEST trigger."
          else
            target=4
            body="MORAN_HOMESCHOOL_REVIEW_TRIGGER date=$local_date hour=$local_hour phase=$phase github_run_id=$RUN_ID timestamp=$stamp. Read and follow the CURRENT live Home Schooling Master Index and run the complete Homeschool Daytime Review & Closeout workflow for all work eligible at this pass. Image-only scans are normal evidence. Preserve Assignment IDs and runtime state."
          fi

          gh api --method POST "repos/$REPO/issues/$target/comments" -f body="$body" >/dev/null
          echo "Delivered $mode $phase notification through target #$target for $local_date $local_hour."
