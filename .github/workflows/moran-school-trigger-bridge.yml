name: Moran School Trigger Bridge

on:
  push:
    paths:
      - '.github/workflows/moran-school-trigger-bridge.yml'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Edit persistent Moran user anchor
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ANCHOR_COMMENT_ID: '5686617452'
        shell: bash
        run: |
          stamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          body="MORAN_HOMESCHOOL_REVIEW_TRIGGER date=$(TZ=America/Chicago date +'%Y-%m-%d') time=$(TZ=America/Chicago date +'%H:%M') phase=ANCHOR_EDIT_RESTORE_VERIFY github_run_id=$RUN_ID timestamp=$stamp. Controlled transport verification under the CURRENT live Home Schooling Master Index. Preserve Assignment IDs and runtime state; perform only idempotent eligible work."
          gh api --method PATCH "repos/$REPO/issues/comments/$ANCHOR_COMMENT_ID" -f body="$body" >/dev/null
          echo "Updated persistent user-authored Moran anchor."
