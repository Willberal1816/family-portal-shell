name: One-time portal consistency repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-step1-filter.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render lunch in week view
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('function renderWeek(w){')
          end=s.index('function advField',start)
          block=s[start:end]
          if 'dayBlocks=scheduleWithBreak(dayItems)' not in block:
              raise SystemExit('Expected dayBlocks calculation missing')
          loop_start=block.index('dayItems.forEach(function(a){')
          loop_end=block.index(");h+='</section>'",loop_start)+2
          replacement="dayBlocks.forEach(function(a){if(a.scheduleBreak){h+='<div class=\"week-class\"><b>'+esc(breakTimeLabel())+' · Lunch / Break</b><div class=\"muted\">Eat, rest, or move around. No school work right now.</div></div>'}else{h+='<div class=\"week-class\"><b>'+esc(a.time&&String(a.time).toLowerCase()!=='flexible'?a.time+' · ':'')+esc(a.subject)+'</b><div>'+esc(lessonTitle(a))+'</div><div class=\"meta\">'+esc(a.status)+'</div></div>'}})"
          block=block[:loop_start]+replacement+block[loop_end:]
          p.write_text(s[:start]+block+s[end:],encoding='utf-8')
      - name: Validate and commit
        run: |
          git diff --check
          grep -q 'dayBlocks=scheduleWithBreak(dayItems)' index.html
          grep -q 'dayBlocks.forEach(function(a){if(a.scheduleBreak)' index.html
          grep -q "s==='assigned'||s==='in progress'" index.html
          if grep -q 'dayItems.forEach(function(a)' index.html; then echo 'stale week loop remains'; exit 1; fi
          git config user.name 'Willberal1816'
          git config user.email 'rmoran4446@mac.com'
          git add index.html
          git commit -m 'Render lunch cards in weekly school view'
          git push