name: One-time Step 1 filter repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-step1-filter.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden refresher attachment
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('function refresherResourceIsDistinct')
          end=s.index('function renderDay',start)
          new='\n'.join([
            "function refresherIsActive(x){var s=String(x&&x.status||'').trim().toLowerCase();return s==='assigned'||s==='in progress'}",
            "function refresherResourceIsUsable(x){if(!refresherIsActive(x))return false;var u=String(x&&x.resource||'').trim();if(!u)return false;try{var q=new URL(u,location.href);return q.origin===location.origin&&q.pathname.indexOf('/family-portal-shell/')===0}catch(e){return false}}",
            "function refresherResourceIsDistinct(a,x){if(!refresherResourceIsUsable(x))return false;var u=String(x&&x.resource||'').trim();function clean(v){return String(v||'').trim().split('#')[0].split('?')[0]}u=clean(u);var urls=[];if(a&&a.resource)urls.push(a.resource);(a&&a.resources||[]).forEach(function(r){if(r&&r.url)urls.push(r.url)});for(var i=0;i<urls.length;i++)if(clean(urls[i])===u)return false;return true}",
            "function attachRefreshers(items,followUps){var used={};(followUps||[]).forEach(function(x){if(!refresherResourceIsUsable(x))return;for(var i=0;i<items.length;i++){var a=items[i],k=subjectKey(a.subject);if(!used[k]&&k===subjectKey(x.subject)&&refresherResourceIsDistinct(a,x)){a.refresher=x;used[k]=true;break}}});return items}"
          ])+'\n'
          p.write_text(s[:start]+new+s[end:],encoding='utf-8')
      - name: Validate and commit
        run: |
          git diff --check
          grep -q "s==='assigned'||s==='in progress'" index.html
          grep -q "q.origin===location.origin" index.html
          grep -q "if(!refresherResourceIsUsable(x))return" index.html
          git config user.name 'Willberal1816'
          git config user.email 'rmoran4446@mac.com'
          git add index.html
          git commit -m 'Reject stale and unusable Step 1 refreshers'
          git push