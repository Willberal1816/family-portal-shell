name: One-time portal consistency repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-step1-filter.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render lunch in week view
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('function renderWeek(w){')
          end=s.index('function advField',start)
          old=s[start:end]
          new=old.replace("var key=iso(d),dayItems=sortSchedule(collapseSharedClasses(items.filter(function(a){return a.date===key}),firstName()));", "var key=iso(d),dayItems=sortSchedule(collapseSharedClasses(items.filter(function(a){return a.date===key}),firstName())),dayBlocks=scheduleWithBreak(dayItems);")
          new=new.replace("dayItems.forEach(function(a){h+='<div class=\\\"week-class\\\"><b>'+esc(a.time&&String(a.time).toLowerCase()!=='flexible'?a.time+' · ':'')+esc(a.subject)+'</b><div>'+esc(lessonTitle(a))+'</div><div class=\\\"meta\\\">'+esc(a.status)+'</div></div>'});", "dayBlocks.forEach(function(a){if(a.scheduleBreak){h+='<div class=\\\"week-class\\\"><b>'+esc(breakTimeLabel())+' · Lunch / Break</b><div class=\\\"muted\\\">Eat, rest, or move around. No school work right now.</div></div>'}else{h+='<div class=\\\"week-class\\\"><b>'+esc(a.time&&String(a.time).toLowerCase()!=='flexible'?a.time+' · ':'')+esc(a.subject)+'</b><div>'+esc(lessonTitle(a))+'</div><div class=\\\"meta\\\">'+esc(a.status)+'</div></div>'}});")
          if new==old:
              raise SystemExit('Week-view lunch patch did not match; refusing unsafe write')
          p.write_text(s[:start]+new+s[end:],encoding='utf-8')
      - name: Validate and commit
        run: |
          git diff --check
          grep -q 'dayBlocks=scheduleWithBreak(dayItems)' index.html
          grep -q 'Lunch / Break' index.html
          grep -q "s==='assigned'||s==='in progress'" index.html
          git config user.name 'Willberal1816'
          git config user.email 'rmoran4446@mac.com'
          git add index.html
          git commit -m 'Show calculated lunch in weekly school view'
          git push