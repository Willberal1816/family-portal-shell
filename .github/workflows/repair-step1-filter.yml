name: One-time portal consistency repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-step1-filter.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix weekly lunch loop syntax
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('function renderWeek(w){')
          end=s.index('function advField',start)
          block=s[start:end]
          bad="}})h+='</section>'"
          good="}});h+='</section>'"
          if bad not in block:
              raise SystemExit('Expected missing-semicolon pattern not found; refusing unsafe write')
          block=block.replace(bad,good,1)
          p.write_text(s[:start]+block+s[end:],encoding='utf-8')
      - name: Validate JavaScript and commit
        shell: bash
        run: |
          git diff --check
          grep -q 'dayBlocks=scheduleWithBreak(dayItems)' index.html
          grep -q 'dayBlocks.forEach(function(a){if(a.scheduleBreak)' index.html
          grep -q "s==='assigned'||s==='in progress'" index.html
          if grep -q 'dayItems.forEach(function(a)' index.html; then echo 'stale week loop remains'; exit 1; fi
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=[]
          for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>',html,re.I|re.S):
              if 'src=' not in attrs.lower(): scripts.append(body)
          if not scripts: raise SystemExit('No inline portal JavaScript found')
          Path('/tmp/portal-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/portal-inline.js
          git config user.name 'Willberal1816'
          git config user.email 'rmoran4446@mac.com'
          git add index.html
          git commit -m 'Fix weekly lunch rendering syntax'
          git push