name: Validate student class lifecycle

on:
  push:
    paths:
      - 'index.html'
      - 'worksheets/**/*.html'
      - 'worksheets/school-page-controls.js'
      - 'worksheets/school-page-controls.css'
      - '.github/workflows/validate-student-class-flow.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'worksheets/**/*.html'
      - 'worksheets/school-page-controls.js'
      - 'worksheets/school-page-controls.css'
      - '.github/workflows/validate-student-class-flow.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch student Review routing
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('index.html')
          s = page.read_text(encoding='utf-8')
          anchor = "function previewWork(row){var a=findAssignment(row);if(a)showWork(a)}"
          helpers = anchor + "\n" + "function reviewPacketUrl(a){return String(advField(a,'reviewPacket','Review Packet')||advField(a,'reviewPacketUrl','Review Packet URL')||'').trim()}" + "\n" + "function showReviewFallback(a){if(!a)return;document.getElementById('app').innerHTML='<article class=\"card work\"><div class=\"lesson-kicker\">Review for '+esc(a.subject)+'</div><h2>'+esc(lessonTitle(a))+'</h2>'+reviewHtml(a)+'<div class=\"actions\"><button onclick=\"returnToDay()\">Back</button></div></article>'}" + "\n" + "function openReview(row){var a=findAssignment(row);if(!a)return;var u=reviewPacketUrl(a);if(u){window.open(u,'_blank');return}showReviewFallback(a)}"

          if 'function openReview(row)' not in s:
              if anchor not in s:
                  raise SystemExit('Could not find previewWork anchor')
              s = s.replace(anchor, helpers, 1)

          old = "onclick=\"previewWork('+a.row+')\">View Review</button>"
          s = s.replace(old, "onclick=\"openReview('+a.row+')\">Review</button>")

          if 'View Review' in s:
              raise SystemExit('A View Review label remains after patch')
          if "onclick=\"openReview('+a.row+')\">Review</button>" not in s:
              raise SystemExit('Review button was not wired to openReview')
          if "advField(a,'reviewPacket','Review Packet')" not in s:
              raise SystemExit('Review Packet field lookup is missing')

          page.write_text(s, encoding='utf-8')
          PY
      - name: Validate end-to-end student controls
        run: |
          python - <<'PY'
          from pathlib import Path

          portal = Path('index.html').read_text(encoding='utf-8')
          controls = Path('worksheets/school-page-controls.js').read_text(encoding='utf-8')
          controls_css = Path('worksheets/school-page-controls.css').read_text(encoding='utf-8')
          errors = []

          required_portal = {
              'active-class continuity': "moranSchoolActiveClass",
              'same-class resume': "reconcileActiveClass",
              'working Finish Class control': "Finish Class",
              'finish opens feedback': "showClassFeedback(active)",
              'feedback submission': "submitClassFeedback",
              'return after feedback': "Back to School Portal",
              'iOS print fallback': "if(isIOSDevice()){window.open(url,'_blank');return}",
              'print-step persistence': "saveStepDone(active,'+i+');rememberActiveClass(active);printWorksheet",
              'worksheet context URL': "function worksheetContextUrl(url)",
              'worksheet student context': "u.searchParams.set('student'",
              'worksheet date context': "u.searchParams.set('date'",
              'worksheet assignment tracking': "u.searchParams.set('assignmentId'",
              'student Review handler': "function openReview(row)",
              'Review Packet binding': "advField(a,'reviewPacket','Review Packet')",
              'student Review button': "onclick=\"openReview('+a.row+')\">Review</button>",
          }
          for label, marker in required_portal.items():
              if marker not in portal:
                  errors.append(f'Portal missing {label}: {marker}')

          if 'View Review' in portal:
              errors.append('Legacy View Review label remains in the student portal')

          if "if(active.completionMode==='mastery')return openMastery()" in portal:
              errors.append('Legacy mastery Finish gate was reintroduced')

          broad_start = "if(a.refresher){if(btn)"
          if broad_start in portal:
              errors.append('A refresher still blocks Start for mastery classes')

          broad_finish = "previewMode||a.status==='Done'||a.refresher"
          if broad_finish in portal:
              errors.append('A refresher still hides Finish Class for mastery classes')

          mastery_exception = "a.refresher&&!/\\bmastery\\b/i.test(lessonTitle(a))"
          if portal.count(mastery_exception) < 3:
              errors.append('Mastery/refresher lifecycle exception is not consistently applied to build/start/finish')

          required_controls = {
              'Back to This Class': 'Back to This Class',
              'Back to School Portal': 'Back to School Portal',
              'history return': 'history.back()',
              'saved portal return': 'moranSchoolPortalReturnUrl',
              'active assignment context': 'moranSchoolActiveClass',
              'student-prefilled identity': '<b>Student:</b>',
              'date-prefilled identity': '<b>Date:</b>',
              'tracking number': 'Tracking #:',
              'assignment-id binding': 'data-assignment-id',
              'manual identity suppression': 'school-manual-id',
              'per-page print tracking': 'position:fixed',
              'print document auto height': 'height:auto!important',
              'question pagination fallback': 'break-inside:auto!important',
              'legacy pagination fallback': 'page-break-inside:auto!important',
          }
          for label, marker in required_controls.items():
              if marker not in controls:
                  errors.append(f'Shared student-page controls missing {label}: {marker}')
              if label in {'print document auto height','question pagination fallback','legacy pagination fallback'} and marker not in controls_css:
                  errors.append(f'Shared print stylesheet missing {label}: {marker}')

          html_pages = sorted(Path('worksheets').rglob('*.html'))
          missing_controls = []
          stale_controls = []
          for page in html_pages:
              text = page.read_text(encoding='utf-8', errors='replace')
              if 'school-page-controls.js' not in text:
                  missing_controls.append(str(page))
              elif 'school-page-controls.js?v=20260901-4' not in text:
                  stale_controls.append(str(page))
          if missing_controls:
              errors.append('Student-facing HTML missing shared class/navigation controls:\n  ' + '\n  '.join(missing_controls))
          if stale_controls:
              errors.append('Student-facing HTML is not loading the current print/control safeguards:\n  ' + '\n  '.join(stale_controls))

          if errors:
              raise SystemExit('\n\n'.join(errors))

          print(f'Validated full class lifecycle, mastery Finish controls, Review Packet routing, worksheet identity/tracking, print pagination safeguards, and shared navigation on {len(html_pages)} student pages.')
          PY
      - name: Check shared controls JavaScript syntax
        run: node --check worksheets/school-page-controls.js
      - name: Commit student Review repair when needed
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- index.html; then
            echo "No portal patch needed."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Open student Review button to daily Review Packet"
          git push
