name: Validate student class lifecycle

on:
  push:
    paths:
      - 'index.html'
      - 'worksheets/**/*.html'
      - 'worksheets/school-page-controls.js'
      - 'worksheets/school-page-controls.css'
      - '.github/workflows/validate-student-class-flow.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'worksheets/**/*.html'
      - 'worksheets/school-page-controls.js'
      - 'worksheets/school-page-controls.css'
      - '.github/workflows/validate-student-class-flow.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate end-to-end student controls
        run: |
          python - <<'PY'
          from pathlib import Path

          portal = Path('index.html').read_text(encoding='utf-8')
          controls = Path('worksheets/school-page-controls.js').read_text(encoding='utf-8')
          errors = []

          required_portal = {
              'active-class continuity': "moranSchoolActiveClass",
              'same-class resume': "reconcileActiveClass",
              'working Finish Class control': "Finish Class",
              'finish opens feedback': "showClassFeedback(active)",
              'feedback submission': "submitClassFeedback",
              'return after feedback': "Back to School Portal",
              'iOS print fallback': "if(isIOSDevice()){window.open(url,'_blank');return}",
              'print-step persistence': "saveStepDone(active,'+i+');rememberActiveClass(active);printWorksheet",
              'worksheet context URL': "function worksheetContextUrl(url)",
              'worksheet student context': "u.searchParams.set('student'",
              'worksheet date context': "u.searchParams.set('date'",
              'worksheet assignment tracking': "u.searchParams.set('assignmentId'",
          }
          for label, marker in required_portal.items():
              if marker not in portal:
                  errors.append(f'Portal missing {label}: {marker}')

          if "if(active.completionMode==='mastery')return openMastery()" in portal:
              errors.append('Legacy mastery Finish gate was reintroduced')

          broad_start = "if(a.refresher){if(btn)"
          if broad_start in portal:
              errors.append('A refresher still blocks Start for mastery classes')

          broad_finish = "previewMode||a.status==='Done'||a.refresher"
          if broad_finish in portal:
              errors.append('A refresher still hides Finish Class for mastery classes')

          mastery_exception = "a.refresher&&!/\\bmastery\\b/i.test(lessonTitle(a))"
          if portal.count(mastery_exception) < 3:
              errors.append('Mastery/refresher lifecycle exception is not consistently applied to build/start/finish')

          required_controls = {
              'Back to This Class': 'Back to This Class',
              'Back to School Portal': 'Back to School Portal',
              'history return': 'history.back()',
              'saved portal return': 'moranSchoolPortalReturnUrl',
              'active assignment context': 'moranSchoolActiveClass',
              'student-prefilled identity': '<b>Student:</b>',
              'date-prefilled identity': '<b>Date:</b>',
              'tracking number': 'Tracking #:',
              'assignment-id binding': 'data-assignment-id',
              'manual identity suppression': 'school-manual-id',
              'per-page print tracking': 'position:fixed',
          }
          for label, marker in required_controls.items():
              if marker not in controls:
                  errors.append(f'Shared student-page controls missing {label}: {marker}')

          html_pages = sorted(Path('worksheets').rglob('*.html'))
          missing_controls = []
          for page in html_pages:
              text = page.read_text(encoding='utf-8', errors='replace')
              if 'school-page-controls.js' not in text:
                  missing_controls.append(str(page))
          if missing_controls:
              errors.append('Student-facing HTML missing shared class/navigation controls:\n  ' + '\n  '.join(missing_controls))

          if errors:
              raise SystemExit('\n\n'.join(errors))

          print(f'Validated full class lifecycle, mastery Finish controls, worksheet identity/tracking, and shared navigation on {len(html_pages)} student pages.')
          PY
      - name: Check shared controls JavaScript syntax
        run: node --check worksheets/school-page-controls.js
