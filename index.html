 if(btn){btn.disabled=true;btn.textContent='Saving…'}var fixValue="array"==='array'?fixes:fixes.join(', '),readinessLine='Readiness: '+ready.value,combinedNote=readinessLine+(note.trim()?'\nStudent note: '+note.trim():''),payload={difficulty:d.value,teachingEnough:t.value,whatToFix:fixValue,whatWouldHelp:help.value,note:combinedNote};api('feedback',{row:active.row,feedback:JSON.stringify(payload)}).then(function(){active.studentFeedbackSubmitted=true;document.getElementById('app').innerHTML='<div class="card"><h2>Thanks — your feedback is saved.</h2><p>Your class is finished.</p><button onclick="loadDay()">Back to School Portal</button></div>'}).catch(function(e){if(btn){btn.disabled=false;btn.textContent='Save My Feedback'}if(err)err.innerHTML='<div class="card error"><b>Feedback was not saved.</b><p>'+esc(e&&e.message?e.message:e)+'</p></div>'})}
assignmentCard=function(a){var future=currentDate>iso(new Date()),working=['In Progress','Still Working','Need Help'].indexOf(a.status)>=0,done=a.status==='Done',reviewed=done&&hasReview(a),pending=done&&!feedbackDone(a),actions=[];if(previewMode){if(reviewed)actions.push('<button class="start" onclick="openReview('+a.row+')">Review</button>');else actions.push('<button class="start" onclick="previewWork('+a.row+')">Preview</button>')}else if(pending){actions.push('<button class="finish" onclick="openClassFeedback('+a.row+')">Finish Class Feedback</button>');if(reviewed)actions.push('<button class="start" onclick="openReview('+a.row+')">Review</button>')}else if(reviewed)actions.push('<button class="start" onclick="openReview('+a.row+')">Review</button>');else if(!done&&!future)actions.push(working?'<button class="start" onclick="continueWork('+a.row+')">Continue</button>':'<button class="start" onclick="startWork('+a.row+',this)">Start</button>');var b=actions.length?'<div class="followup-actions">'+actions.join('')+'</div>':'',state=done?'<span class="status">'+(pending?'Feedback Pending':(reviewed?'Reviewed':'Finished'))+'</span>':future?'<span class="status">Upcoming</span>':'',shared=sharedClass(a)?' shared':'',theme=subjectTheme(a);return '<article class="card class-card subject-'+theme[0]+shared+'"><div class="class-top"><div class="class-subject-wrap"><span class="subject-badge" data-subject="'+theme[0]+'">'+theme[1]+'</span><div class="class-subject">'+esc(a.subject)+'</div></div><div class="class-time">'+esc(a.time&&String(a.time).toLowerCase()!=='flexible'?lessonTimeRange(a):'')+'</div></div><div class="class-bottom"><div class="class-title">'+esc(lessonTitle(a))+advancementHtml(a)+'</div><div class="class-card-action">'+b+state+'</div></div><span class="theme-watermark" data-subject="'+theme[0]+'">'+esc(themeMotif(portalTheme,theme[0]))+'</span></article>'}
finishActive=function(btn){if(!active)return;if(btn){btn.disabled=true;btn.textContent='Finishing…'}api('finish',{row:active.row}).then(function(){clearActiveClass();active.status='Done';active.studentFeedbackSubmitted=false;showClassFeedback(active)}).catch(function(e){if(btn){btn.disabled=false;btn.textContent='Finish Class'}var a=document.getElementById('helpArea');if(a)a.innerHTML='<div class="card error"><b>Class was not finished.</b><p>'+esc(e&&e.message?e.message:e)+'</p><p>Your class is still open. Try Finish Class again.</p></div>';else errorBox(e)})}
submitMastery=function(checkId,count,btn){var ans=[];for(var i=0;i<count;i++){var r=document.querySelector('input[name="mq'+i+'"]:checked'),t=document.getElementById('mq'+i);ans.push(r?r.value:(t?t.value:''))}if(btn){btn.disabled=true;btn.textContent='Checking…'}api('submit',{row:active.row,checkId:checkId,answers:JSON.stringify(ans)}).then(function(r){if(r.mastered){clearActiveClass();active.status='Done';active.studentFeedbackSubmitted=false;showClassFeedback(active,'<div class="note"><b>Ready Check complete:</b> '+esc(r.correct)+' of '+esc(r.total)+' correct. '+esc(r.feedback||'')+'</div>')}else document.getElementById('app').innerHTML='<div class="card"><h2>Good work — let’s keep practicing.</h2><p><b>'+esc(r.correct)+' of '+esc(r.total)+' correct</b></p><p>'+esc(r.feedback||'')+'</p><button onclick="loadDay()">Back to School Portal</button></div>'}).catch(errorBox)}
