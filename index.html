<style>
:root{--bg:#f5f7fa;--panel:#fff;--text:#172033;--muted:#667085;--line:#d7dee8;--accent:#2563eb;--soft:#e5f1ff;--help:#ffe0e0;--done:#daf5e3}

body[data-theme="ocean"]{--bg:#00779b;--panel:#f9feff;--text:#103746;--muted:#547b88;--line:#65cde5;--accent:#0ea5e9;--soft:#bfefff;--help:#ffd8d3;--done:#c5f3e6}
body[data-theme="garden"]{--bg:#267a3b;--panel:#fbfff9;--text:#203a25;--muted:#5f795f;--line:#88d398;--accent:#22c55e;--soft:#c9efb5;--help:#ffd9cf;--done:#bff0ca}
body[data-theme="studio"]{--bg:#f06449;--panel:#fffaf7;--text:#40252f;--muted:#825e68;--line:#ffad91;--accent:#f43f5e;--soft:#e5c3ff;--help:#ffd0da;--done:#c5f1cf}

*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
.shell{max-width:980px;margin:auto;padding:14px 12px 36px}header{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:6px 0 12px}.brand h1{font-size:1.35rem;margin:0}.brand small{color:var(--muted)}
.toolbar{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}button,select,a.btn{font:inherit;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);padding:10px 13px;text-decoration:none;font-weight:650}button:active,a.btn:active{transform:scale(.98)}
.hero,.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 10px rgba(0,70,90,.05)}.hero{border-top:5px solid var(--accent)}
.muted{color:var(--muted)}.note,.joke{background:var(--soft);border-radius:13px;padding:12px 13px;margin-top:10px;line-height:1.45}.label{font-size:.82rem;font-weight:800;color:var(--muted);margin-bottom:5px}
.section{font-size:1.05rem;margin:20px 2px 8px}.meta{color:var(--muted);font-size:.92rem}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.start{background:#ddecff}.help{background:var(--help)}.finish{background:var(--done)}.schedule-grid,.week-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.class-card{margin:0;min-height:0;padding:10px 12px}.class-card.shared{grid-column:1/-1}.class-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.class-subject{font-size:1.12rem;font-weight:800}.class-time{font-weight:800;color:var(--accent);white-space:nowrap}.class-bottom{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;margin-top:7px}.class-card-action{display:flex;justify-content:flex-end;align-items:center}.class-card-action .start{min-height:30px;padding:4px 10px;font-size:.82rem}.class-card-action .status{margin:0}.class-title{font-size:1rem;line-height:1.3;margin:0}.class-card .actions{margin-top:auto;padding-top:12px}.week-day{margin:0}.week-class{padding:10px 0;border-top:1px solid var(--line);line-height:1.35}.week-class:first-of-type{border-top:0}.lesson-kicker{font-size:.95rem;color:var(--muted);font-weight:750}.lesson-outline{display:grid;gap:8px;margin:16px 0}.lesson-accordion{border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}.step-head{width:100%;border:0;border-radius:0;display:flex;align-items:center;gap:10px;text-align:left;background:var(--panel);min-height:58px}.step-number{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--soft);font-weight:850;flex:0 0 auto}.step-title{flex:1}.step-check{font-weight:850;color:#14804a}.step-body{padding:0 14px 14px}.step-next{margin-top:12px}.lesson-accordion.open .step-head{background:var(--soft)}.lesson-action,.lesson-instruction{border:1px solid var(--line);border-radius:14px;background:var(--panel);min-height:58px;display:flex;align-items:center;gap:10px;padding:10px 13px}.lesson-action{width:100%;text-align:left}.lesson-action:active{transform:scale(.99)}.lesson-instruction .step-title{font-weight:650}.print-note{font-size:.86rem;color:var(--muted);margin-left:auto}
.status{display:inline-block;border-radius:999px;background:var(--soft);padding:5px 9px;font-size:.85rem;font-weight:700}.break-card{background:var(--soft)!important}.break-card .break-next{font-weight:800;color:var(--muted);text-align:right;white-space:nowrap}.break-card .class-title{color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:28px 12px}
.work{min-height:70vh;display:flex;flex-direction:column;text-align:left}.work h2{font-size:1.8rem;margin:8px 0}.clock{font-size:2.8rem;font-weight:800;margin:22px 0 4px}.instruction{font-size:1.08rem;line-height:1.55;max-width:600px;margin:15px auto}.work .actions{justify-content:flex-start}.work .actions button,.work .actions a{min-width:145px}
.helpbox{margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.lesson-step{margin:14px 0;padding:13px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.lesson-step h3{margin:0 0 10px}.video-frame{position:relative;width:100%;padding-top:56.25%;overflow:hidden;border-radius:12px;background:#000}.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.worksheet-frame{width:100%;height:720px;border:1px solid var(--line);border-radius:12px;background:white}.helpgrid{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}.answer{background:var(--soft);border-radius:12px;padding:12px;margin-top:10px;text-align:left;line-height:1.5}
.error{background:#fff1f1;border-color:#f3b6b6}.hidden{display:none!important}details{margin-top:7px}summary{font-weight:700;cursor:pointer}
@media(max-width:700px){.schedule-grid,.week-grid{grid-template-columns:1fr}.class-card.shared{grid-column:auto}}@media(max-width:600px){.shell{padding:10px 10px 28px}header{align-items:flex-start;flex-wrap:wrap}.brand{flex:1 0 100%}.brand h1{font-size:1.25rem}.toolbar button{padding:9px 11px}.hero,.card{padding:14px}.work .actions{display:grid}.work .actions button,.work .actions a{width:100%}.clock{font-size:2.35rem}}
/* playful subject card pass */
.class-card{position:relative;overflow:hidden;isolation:isolate}
.class-card>*{position:relative;z-index:2}
.class-card::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.58;background-repeat:no-repeat}
.class-card::after{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--subject-accent,var(--accent));opacity:.9;z-index:1}
.class-subject-wrap{display:flex;align-items:center;gap:8px;min-width:0}
.subject-badge{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:0 0 28px;font-size:.9rem;font-weight:850;background:var(--subject-soft,var(--soft));color:var(--subject-accent,var(--accent));border:1px solid var(--line)}
.subject-math{--subject-accent:#2489ef;--subject-soft:#e5f2ff;background:var(--panel)}
.subject-math::before{background-image:linear-gradient(rgba(36,137,239,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(36,137,239,.07) 1px,transparent 1px),radial-gradient(circle at 88% 34%,rgba(36,137,239,.16) 0 7px,transparent 8px),linear-gradient(35deg,transparent 69%,rgba(36,137,239,.12) 70% 72%,transparent 73%);background-size:22px 22px,22px 22px,100% 100%,100% 100%}
.subject-language{--subject-accent:#9b63e9;--subject-soft:#f0e5ff;background:var(--panel)}
.subject-language::before{background-image:radial-gradient(circle at 86% 28%,rgba(155,99,233,.13) 0 5px,transparent 6px),radial-gradient(circle at 93% 70%,rgba(155,99,233,.10) 0 9px,transparent 10px),linear-gradient(150deg,transparent 74%,rgba(155,99,233,.10) 75% 77%,transparent 78%)}
.subject-science{--subject-accent:#45a95a;--subject-soft:#e4f5e7;background:var(--panel)}
.subject-science::before{background-image:radial-gradient(circle at 78% 43%,transparent 0 18px,rgba(69,169,90,.12) 19px 21px,transparent 22px),radial-gradient(circle at 78% 43%,rgba(69,169,90,.12) 0 4px,transparent 5px),radial-gradient(circle at 91% 28%,rgba(69,169,90,.13) 0 6px,transparent 7px),radial-gradient(circle at 94% 72%,rgba(69,169,90,.09) 0 11px,transparent 12px)}
.subject-reading{--subject-accent:#4c97e8;--subject-soft:#e5f1ff;background:var(--panel)}
.subject-reading::before{background-image:radial-gradient(circle at 83% 35%,rgba(76,151,232,.11) 0 6px,transparent 7px),radial-gradient(circle at 91% 65%,rgba(76,151,232,.09) 0 10px,transparent 11px),linear-gradient(25deg,transparent 74%,rgba(76,151,232,.10) 75% 77%,transparent 78%)}
.subject-social{--subject-accent:#d9912f;--subject-soft:#fff0dc;background:var(--panel)}
.subject-social::before{background-image:repeating-radial-gradient(ellipse at 84% 50%,transparent 0 12px,rgba(217,145,47,.09) 13px 14px,transparent 15px 25px),linear-gradient(62deg,transparent 71%,rgba(217,145,47,.09) 72% 74%,transparent 75%)}
.subject-health{--subject-accent:#e45f7b;--subject-soft:#ffe6eb;background:var(--panel)}
.subject-health::before{background-image:radial-gradient(circle at 85% 35%,rgba(228,95,123,.12) 0 7px,transparent 8px),radial-gradient(circle at 93% 67%,rgba(228,95,123,.09) 0 11px,transparent 12px),linear-gradient(42deg,transparent 72%,rgba(228,95,123,.10) 73% 75%,transparent 76%)}
.subject-art{--subject-accent:#ed7952;--subject-soft:#ffe9e0;background:var(--panel)}
.subject-art::before{background-image:radial-gradient(circle at 84% 32%,rgba(237,121,82,.13) 0 6px,transparent 7px),radial-gradient(circle at 92% 64%,rgba(237,121,82,.10) 0 12px,transparent 13px)}
.break-card{--subject-accent:#dda229;--subject-soft:#fff1c9;background:var(--soft)!important}
.break-card::before{background-image:radial-gradient(circle at 85% 34%,rgba(221,162,41,.13) 0 8px,transparent 9px),radial-gradient(circle at 94% 68%,rgba(221,162,41,.09) 0 12px,transparent 13px)}
.subject-math .class-time,.subject-reading .class-time{color:#2489ef}.subject-language .class-time{color:#9b63e9}.subject-science .class-time{color:#45a95a}.subject-social .class-time{color:#d9912f}.subject-health .class-time{color:#e45f7b}.subject-art .class-time{color:#ed7952}.break-card .class-time{color:#d39118}.break-card .break-next{color:#b77c14}
.brand small{display:none}.student-hero{padding:12px 14px}.student-hero-top{display:grid;grid-template-columns:minmax(210px,.72fr) minmax(0,1.28fr);gap:10px;align-items:stretch}.student-hero-top h2{margin:0;padding:10px 4px;align-self:center}.student-hero .note,.student-hero .joke,.student-hero .fun-fact{margin:0;padding:10px 12px}.student-hero-bottom{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.fun-fact{background:var(--soft);border-radius:13px;line-height:1.45}@media(max-width:700px){.student-hero-top,.student-hero-bottom{grid-template-columns:1fr}.student-hero-top h2{padding:4px 2px}}
</style></head><body data-theme="clean"><div class="shell">
<header><div class="brand"><h1>Moran School</h1><small id="portalDate"></small></div><div class="toolbar"><button onclick="shiftDay(-1)">◀</button><button id="todayBtn" onclick="today()">Today</button><button id="weekBtn" onclick="toggleWeek()">Week</button><button onclick="shiftDay(1)">▶</button><select id="themeSelect" onchange="changeTheme(this.value)"><option value="clean">Clean</option><option value="cosmic">Cosmic</option><option value="ocean">Ocean</option><option value="garden">Garden</option><option value="studio">Creative Studio</option><option value="dark">Dark</option></select></div></header>
<div id="app"><div class="card empty">Opening School Portal…</div></div>
</div><script>
var backend='',currentDate='',data=null,active=null,clockTimer=null,mode='day';
function pad2(n){return n<10?'0'+n:String(n)}
function iso(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function decode64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return atob(s)}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function api(action,params){return new Promise(function(resolve,reject){
 var cb='school_cb_'+Date.now()+'_'+Math.floor(Math.random()*100000),s=document.createElement('script'),q=['api='+encodeURIComponent(action),'callback='+encodeURIComponent(cb)];
 params=params||{};Object.keys(params).forEach(function(k){q.push(encodeURIComponent(k)+'='+encodeURIComponent(params[k]))});
 window[cb]=function(r){delete window[cb];if(s.parentNode)s.parentNode.removeChild(s);if(r&&r.ok)resolve(r.data);else reject(new Error(r&&r.error?r.error:'School Portal request failed.'))};
 s.onerror=function(){delete window[cb];if(s.parentNode)s.parentNode.removeChild(s);reject(new Error('Could not reach the School Portal.'))};
 s.src=backend+(backend.indexOf('?')>=0?'&':'?')+q.join('&');document.head.appendChild(s);
})}
function errorBox(err){document.getElementById('app').innerHTML='<div class="card error"><b>School Portal could not load.</b><p>'+esc(err&&err.message?err.message:err)+'</p><button onclick="loadDay()">Try Again</button></div>'}
function init(){var h=location.hash.replace(/^#/,'');var m=h.match(/(?:^|&)b=([^&]+)/);if(m){try{backend=decode64u(decodeURIComponent(m[1]));localStorage.setItem('schoolPortalBackend',backend)}catch(e){}}
 if(!backend)backend=localStorage.getItem('schoolPortalBackend')||'';currentDate=iso(new Date());
 if(!backend){document.getElementById('app').innerHTML='<div class="card error"><b>This School Portal link is incomplete.</b><p>Please open the School Portal button from the email Dad sent.</p></div>';return}loadDay()}
function loadDay(){stopClock();active=null;updateDateNav();document.body.className='';document.getElementById('app').innerHTML='<div class="card empty">Opening school day…</div>';api('data',{date:currentDate}).then(function(d){data=d;renderDay()}).catch(errorBox)}
function shiftDay(n){var d=new Date(currentDate+'T12:00:00');d.setDate(d.getDate()+n*(mode==='week'?7:1));currentDate=iso(d);if(mode==='week')loadWeek();else loadDay()}
function today(){mode='day';currentDate=iso(new Date());setModeButton();loadDay()}
function shortNavDate(key){var d=new Date(key+'T12:00:00');return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}
function navWeekRange(key){var d=new Date(key+'T12:00:00'),start=new Date(d);start.setDate(d.getDate()-d.getDay());var end=new Date(start);end.setDate(start.getDate()+6);return shortNavDate(iso(start))+'–'+shortNavDate(iso(end))}
function updateDateNav(){var day=document.getElementById('todayBtn'),week=document.getElementById('weekBtn'),todayKey=iso(new Date());if(day)day.textContent=currentDate===todayKey?'Today · '+shortNavDate(currentDate):shortNavDate(currentDate);if(week)week.textContent=mode==='week'?'Day · '+shortNavDate(currentDate):'Week · '+navWeekRange(currentDate)}
function setModeButton(){updateDateNav()}
function toggleWeek(){mode=mode==='week'?'day':'week';setModeButton();if(mode==='week')loadWeek();else loadDay()}
function applyTheme(theme){var allowed=['clean','cosmic','ocean','garden','studio','dark'];theme=allowed.indexOf(theme)>=0?theme:'clean';document.body.dataset.theme=theme;var s=document.getElementById('themeSelect');if(s)s.value=theme}
function changeTheme(theme){applyTheme(theme);api('theme',{theme:theme}).catch(function(err){console.error(err)})}
function loadWeek(){stopClock();active=null;updateDateNav();document.getElementById('app').innerHTML='<div class="card empty">Opening your week…</div>';api('week',{date:currentDate}).then(renderWeek).catch(errorBox)}
function openWeekDay(date){mode='day';currentDate=date;setModeButton();loadDay()}
function firstName(){return data&&data.view==='natalie'?'Natalie':'Emma'}
function lessonTitle(a){return String(a&&a.assignment||'').split(/\r?\n/)[0].trim()||String(a&&a.subject||'Assignment')}
function timeRank(a){var s=String(a&&a.time||'').trim().toLowerCase();if(!s||s==='flexible')return 9999;var m=s.match(/^(\d{1,2}):(\d{2})/);if(!m)return 9999;var h=Number(m[1]),n=Number(m[2]);if(h<6)h+=12;return h*60+n}
function sortSchedule(items){return (items||[]).slice().sort(function(a,b){return timeRank(a)-timeRank(b)||String(a.subject||'').localeCompare(String(b.subject||''))})}
function sharedClass(a){return String(a&&a.student||'').toLowerCase()==='shared'||/shared/i.test(String(a&&a.type||''))}
function statusLabel(a,future){if(a.status==='Done')return'Finished';if(future)return'Upcoming';if(['In Progress','Still Working','Need Help'].indexOf(a.status)>=0)return'In Progress';return'Ready'}
function lessonTimeRange(a){var raw=String(a&&a.time||'').trim(),m=raw.match(/^(\d{1,2}):(\d{2})/);if(!m)return raw;var h=Number(m[1]),n=Number(m[2]);if(h<6)h+=12;var start=((h%12)||12)+':'+String(n).padStart(2,'0'),endTotal=h*60+n+Number(a&&a.plannedMinutes||0),eh=Math.floor(endTotal/60)%24,en=endTotal%60;return start+'–'+((eh%12)||12)+':'+String(en).padStart(2,'0')}
function subjectTheme(a){var s=String(a&&a.subject||'').toLowerCase();if(/math/.test(s))return['math','＋'];if(/language arts|writing|grammar|spelling/.test(s))return['language','A'];if(/reading/.test(s))return['reading','▤'];if(/science/.test(s))return['science','✦'];if(/social studies|history|geography/.test(s))return['social','⌖'];if(/health|life skills/.test(s))return['health','♥'];if(/art|music|creative/.test(s))return['art','★'];return['reading','★']}
function needsBreak(items){return (items||[]).some(function(a){return timeRank(a)<750})&&(items||[]).some(function(a){return timeRank(a)>=780})}
function scheduleWithBreak(items){var out=(items||[]).slice();if(needsBreak(out))out.push({scheduleBreak:true,time:'12:30'});return out.sort(function(a,b){return timeRank(a)-timeRank(b)})}
function breakCard(){return '<article class="card class-card break-card"><div class="class-top"><div class="class-subject-wrap"><span class="subject-badge">☀</span><div class="class-subject">Lunch / Break</div></div><div class="class-time">12:30–1:00</div></div><div class="class-bottom"><div class="class-title">Eat, rest, or move around. No school work right now.</div><div class="break-next">Reading next</div></div></article>'}
function funFactFor(dateKey,name){var facts=['Octopuses have three hearts.','A day on Venus is longer than a year on Venus.','Honeybees can communicate directions with a waggle dance.','The Eiffel Tower can grow slightly taller in hot weather.','Sea otters sometimes hold hands while they sleep so they do not drift apart.','Bananas are berries, but strawberries are not botanically berries.','Sharks existed before trees appeared on Earth.','A group of flamingos is called a flamboyance.','The Moon moves about 3.8 centimeters farther from Earth each year.','Butterflies taste with sensors on their feet.','Some turtles can breathe through specialized areas near their tails.','Wombat droppings are cube-shaped.','Saturn would float in water if you had an ocean large enough.','The fingerprints of koalas can look remarkably similar to human fingerprints.','Lightning can heat the air around it to temperatures hotter than the surface of the Sun.','A hummingbird can fly backward.','Crows can recognize and remember human faces.','The largest known volcano in our solar system is Olympus Mons on Mars.','Dolphins use unique signature whistles that work a bit like names.','An adult human body has 206 bones.','The heart of a blue whale can weigh hundreds of pounds.','Some bamboo species can grow more than two feet in a single day.','A teaspoon of healthy soil can contain billions of microorganisms.','The tiny dot over a lowercase i or j is called a tittle.'],d=new Date(dateKey+'T12:00:00'),day=Math.floor(d.getTime()/86400000),offset=String(name).toLowerCase()==='natalie'?7:0;return facts[(day+offset)%facts.length]}
function greetingHtml(){var g=data.dailyGreeting||{},fact=funFactFor(data.date||currentDate,firstName());return '<div class="student-hero-top"><h2>Good morning, '+esc(firstName())+'</h2><div class="note"><div class="label">From Mom & Dad</div>'+esc(g.note||'')+'</div></div><div class="student-hero-bottom"><div class="joke"><div class="label">Silly joke of the day</div><b>'+esc(g.jokeQuestion||'')+'</b><details><summary>Show punchline</summary><div style="margin-top:6px">'+esc(g.jokeAnswer||'')+'</div></details></div><div class="fun-fact"><div class="label">Fun fact</div>'+esc(fact)+'</div></div>'}
function renderDay(){document.getElementById('portalDate').textContent=data.displayDate||currentDate;applyTheme(data.theme||'clean');var items=sortSchedule(data.assignments||[]),blocks=scheduleWithBreak(items),isToday=data.date===iso(new Date()),h='';if(isToday)h+='<section class="hero student-hero">'+greetingHtml()+'</section>';if(data.prepItems&&data.prepItems.length){h+='<h2 class="section">Get Ready</h2>';data.prepItems.forEach(function(x){h+='<div class="card"><b>'+esc(x.action)+': '+esc(x.item)+'</b>'+(x.notes?'<p class="muted">'+esc(x.notes)+'</p>':'')+'<div class="actions"><button onclick="finishPrep(\''+esc(x.prepId)+'\',this)">I’ve Got It Ready</button></div></div>'})}if(!items.length)h+='<div class="card empty">Nothing is assigned for this day yet.</div>';else{h+='<h2 class="section">'+(isToday?'Today’s Classes':'Classes')+'</h2><div class="schedule-grid">';blocks.forEach(function(a){h+=a.scheduleBreak?breakCard():assignmentCard(a)});h+='</div>'}document.getElementById('app').innerHTML=h}
function renderWeek(w){var range=(w.startLabel||'')+' – '+(w.endLabel||'');document.getElementById('portalDate').textContent=range;var items=w.assignments||[],prep=w.studentPrep||[],h='<h2 class="section">Your Week</h2>';if(prep.length){h+='<div class="card"><b>Get Ready This Week</b>';prep.forEach(function(x){h+='<div style="padding:9px 0;border-top:1px solid var(--line)">'+esc(x.action)+': '+esc(x.item)+' <span class="muted">('+esc(x.dateLabel)+')</span></div>'});h+='</div>'}var base=new Date(w.start+'T12:00:00'),names=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];h+='<div class="week-grid">';for(var i=0;i<7;i++){var d=new Date(base);d.setDate(base.getDate()+i);var key=iso(d),dayItems=sortSchedule(items.filter(function(a){return a.date===key}));h+='<section class="card week-day"><div class="class-top"><div><b>'+names[i]+'</b><div class="meta">'+(d.getMonth()+1)+'/'+d.getDate()+'</div></div><button onclick="openWeekDay(\''+key+'\')">Open Day</button></div>';if(!dayItems.length)h+='<div class="muted" style="padding-top:12px">No school work</div>';dayItems.forEach(function(a){h+='<div class="week-class"><b>'+esc(a.time&&String(a.time).toLowerCase()!=='flexible'?a.time+' · ':'')+esc(a.subject)+'</b><div>'+esc(lessonTitle(a))+'</div><div class="meta">'+esc(a.status)+'</div></div>'});h+='</section>'}h+='</div>';document.getElementById('app').innerHTML=h;setModeButton()}
function assignmentCard(a){var future=currentDate>iso(new Date()),working=['In Progress','Still Working','Need Help'].indexOf(a.status)>=0,done=a.status==='Done',b=(done||future)?'':working?'<button class="start" onclick="continueWork('+a.row+')">Continue</button>':'<button class="start" onclick="startWork('+a.row+',this)">Start</button>';var state=done?'<span class="status">Finished</span>':future?'<span class="status">Upcoming</span>':'',shared=sharedClass(a)?' shared':'',theme=subjectTheme(a);return '<article class="card class-card subject-'+theme[0]+shared+'"><div class="class-top"><div class="class-subject-wrap"><span class="subject-badge">'+theme[1]+'</span><div class="class-subject">'+esc(a.subject)+'</div></div><div class="class-time">'+esc(a.time&&String(a.time).toLowerCase()!=='flexible'?lessonTimeRange(a):'')+'</div></div><div class="class-bottom"><div class="class-title">'+esc(lessonTitle(a))+'</div><div class="class-card-action">'+b+state+'</div></div></article>'}
function findAssignment(row){var arr=data&&data.assignments||[];for(var i=0;i<arr.length;i++)if(Number(arr[i].row)===Number(row))return arr[i];return null}
function primaryResource(a){var rs=a.resources||[];for(var i=0;i<rs.length;i++)if(/video|youtube|website|online|lesson/i.test([rs[i].type,rs[i].label,rs[i].url].join(' ')))return rs[i];return rs[0]||null}
function shouldLaunch(a){return ['video','online','mixed'].indexOf(a.workFormat)>=0}
function videoEmbedUrl(r){var s=[r&&r.url||'',r&&r.label||''].join(' ');if(/introduction-to-the-coordinate-plane/i.test(s))return'https://www.youtube-nocookie.com/embed/pAlq9fFwtus?rel=0';if(/multiplying-mixed-numbers/i.test(s))return'https://www.youtube-nocookie.com/embed/hjbSbHr3Fhk?rel=0';if(/multiplying-fractions/i.test(s))return'https://www.youtube-nocookie.com/embed/CTKMK1ZGLuk?rel=0';var m=s.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?v=|embed\/))([A-Za-z0-9_-]{11})/);return m?'https://www.youtube-nocookie.com/embed/'+m[1]+'?rel=0':''}
function resourceMatchesStudent(r){var l=String(r&&r.label||'').trim(),m=l.match(/^(Natalie|Emma)\b/i);return !m||m[1].toLowerCase()===firstName().toLowerCase()}
function buildLessonSteps(a){var videos=[],paper=[],other=[];(a.resources||[]).forEach(function(r){if(!resourceMatchesStudent(r))return;var e=videoEmbedUrl(r);if(e)videos.push({kind:'video',resource:r,embed:e});else if(/printable|worksheet|paper/i.test([r.type,r.label].join(' ')))paper.push({kind:'paper',resource:r});else other.push({kind:'other',resource:r})});var out=[];videos.forEach(function(x,i){x.title=i===0?'Watch Lesson':(/example/i.test(x.resource.label||'')?'Watch an Example':'Watch Another Example');out.push(x)});paper.forEach(function(x){x.title='Print and Complete Your Practice Sheet';out.push(x)});other.forEach(function(x){x.title=x.resource.label||'Open Resource';out.push(x)});out.push({kind:'turnin',title:'Turn In Your Work to Mom or Dad'});return out}
function stepStoreKey(a){return'lesson-step-done:'+(a.id||a.row)}
function readStepDone(a){try{return JSON.parse(localStorage.getItem(stepStoreKey(a))||'{}')||{}}catch(e){return{}}}
function saveStepDone(a,idx){var d=readStepDone(a);d[idx]=true;try{localStorage.setItem(stepStoreKey(a),JSON.stringify(d))}catch(e){}}
function toggleLessonStep(idx){var el=document.getElementById('lesson-step-'+idx);if(!el)return;var open=el.classList.contains('open');document.querySelectorAll('.lesson-accordion').forEach(function(x){x.classList.remove('open');var b=x.querySelector('.step-body');if(b)b.classList.add('hidden')});if(!open){el.classList.add('open');var body=el.querySelector('.step-body');if(body)body.classList.remove('hidden');el.scrollIntoView({behavior:'smooth',block:'nearest'})}}
function nextLessonStep(idx){if(!active)return;saveStepDone(active,idx);showWork(active,idx+1)}
function stepBody(step,idx,total){var next='<button class="step-next" onclick="nextLessonStep('+idx+')">Next Step</button>';if(step.kind==='video')return '<div class="video-frame"><iframe src="'+esc(step.embed)+'" title="'+esc(step.resource.label||step.title)+'" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe></div>'+next;return ''}
function printWorksheet(url){var old=document.getElementById('print-frame');if(old)old.remove();var f=document.createElement('iframe');f.id='print-frame';f.style.position='fixed';f.style.right='0';f.style.bottom='0';f.style.width='1px';f.style.height='1px';f.style.border='0';f.style.opacity='0';f.onload=function(){try{f.contentWindow.focus();f.contentWindow.print()}catch(e){window.open(url,'_blank')}};f.src=url;document.body.appendChild(f)}
function startWork(row,btn){var a=findAssignment(row);if(!a)return;if(btn){btn.disabled=true;btn.textContent='Starting…'}api('start',{row:row}).then(function(){a.status='In Progress';showWork(a)}).catch(errorBox)}
function continueWork(row){var a=findAssignment(row);if(!a)return;showWork(a)}
function workLabel(a){if(a.completionMode==='placement')return'Paper placement';return{video:'Video lesson',online:'Online lesson',paper:'Paper work',book:'Book / reading','hands-on':'Hands-on activity',mixed:'Mixed lesson',offscreen:'Off-screen work'}[a.workFormat]||'Assignment'}
function workInstruction(a){if(a.completionMode==='placement')return'Work on your printed placement check. You do not need to keep using this screen. Come back here if you need help or when you are finished.';if(a.workFormat==='paper')return'Work from your printed page. Come back here if you need help or when you are finished.';if(a.workFormat==='book')return'Use the book or pages named in your assignment. Come back here if you need help or when you are finished.';if(a.workFormat==='hands-on')return'Do the activity described in your assignment. Keep this screen nearby only if you need help or when you are finished.';if(a.workFormat==='video'||a.workFormat==='online')return'Your lesson opens separately. When you come back here, you can get help or finish your work.';if(a.workFormat==='mixed')return'Follow the lesson resources in order. Some parts use the screen and some parts happen away from it.';return'Do the assignment described above. You only need this screen for help or when you are finished.'}
function showWork(a,openIdx){active=a;var steps=buildLessonSteps(a),done=readStepDone(a);if(typeof openIdx!=='number'){openIdx=0;for(var i=0;i<steps.length;i++){if(steps[i].kind==='video'&&!done[i]){openIdx=i;break}}}var h='<article class="card work"><div class="lesson-kicker">Today’s Lesson for '+esc(a.subject)+'</div><h2>'+esc(lessonTitle(a))+'</h2><div class="lesson-outline">';steps.forEach(function(step,i){var checked=done[i]?' <span class="step-check">✓</span>':'';if(step.kind==='video'){var isOpen=i===openIdx;h+='<section id="lesson-step-'+i+'" class="lesson-accordion'+(isOpen?' open':'')+'"><button class="step-head" onclick="toggleLessonStep('+i+')"><span class="step-number">'+(i+1)+'</span><span class="step-title">'+esc(step.title)+'</span>'+checked+'<span>⌄</span></button><div class="step-body'+(isOpen?'':' hidden')+'">'+stepBody(step,i,steps.length)+'</div></section>'}else if(step.kind==='paper'){h+='<button class="lesson-action" onclick="printWorksheet(\''+esc(step.resource.url)+'\')"><span class="step-number">'+(i+1)+'</span><span class="step-title">'+esc(step.title)+'</span><span class="print-note">Print</span></button>'}else if(step.kind==='turnin'){h+='<div class="lesson-instruction"><span class="step-number">'+(i+1)+'</span><span class="step-title">'+esc(step.title)+'</span></div>'}else{h+='<a class="lesson-action" href="'+esc(step.resource.url)+'" target="_blank"><span class="step-number">'+(i+1)+'</span><span class="step-title">'+esc(step.title)+'</span></a>'}});h+='</div><div class="actions"><button onclick="loadDay()">Back to Today</button><button class="finish" onclick="finishActive(this)">Finished</button><button class="help" onclick="showHelpMenu()">Need Help</button></div><div id="helpArea"></div></article>';document.getElementById('app').innerHTML=h}
function startClock(){stopClock();function tick(){var e=document.getElementById('clock');if(e)e.textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}tick();clockTimer=setInterval(tick,15000)}
function stopClock(){if(clockTimer){clearInterval(clockTimer);clockTimer=null}}
function showHelpMenu(){if(!active)return;var placement=active.completionMode==='placement',h='<div class="helpbox"><b>What would help?</b><div class="muted">Choose one. This is here to help you get unstuck, not to give you the answer.</div><div class="helpgrid">';if(placement)h+='<button onclick="helpChoice(\'directions\',this)">Explain the directions</button><button onclick="helpChoice(\'placementMeaning\',this)">What does “not learned yet” mean?</button><button onclick="helpChoice(\'resource\',this)">Something is not working</button>';else h+='<button onclick="helpChoice(\'hint1\',this)">Give me a hint</button><button onclick="helpChoice(\'explain\',this)">Explain it another way</button><button onclick="helpChoice(\'example\',this)">Show me a similar example</button><button onclick="helpChoice(\'directions\',this)">I do not understand the directions</button>';h+='<button class="help" onclick="helpChoice(\'parent\',this)">I still need a parent</button><button onclick="closeHelp()">Close</button></div></div>';document.getElementById('helpArea').innerHTML=h}
function closeHelp(){var e=document.getElementById('helpArea');if(e)e.innerHTML=''}
function helpChoice(action,btn){if(!active)return;if(btn){btn.disabled=true;btn.textContent='Getting help…'}api('help',{row:active.row,action:action}).then(function(r){var h='<div class="helpbox"><b>'+esc(r.title||'Help')+'</b><div class="answer">'+esc(r.text||'')+'</div><div class="helpgrid">';if(r.hasAnotherHint)h+='<button onclick="helpChoice(\'hint2\',this)">Give me another hint</button>';if(!r.parent)h+='<button onclick="showHelpMenu()">More help choices</button>';h+='<button onclick="closeHelp()">Close</button></div></div>';document.getElementById('helpArea').innerHTML=h}).catch(errorBox)}
function finishActive(btn){if(!active)return;if(btn){btn.disabled=true;btn.textContent='Saving…'}if(active.completionMode==='mastery')return openMastery();api('finish',{row:active.row}).then(function(){loadDay()}).catch(errorBox)}
function finishPrep(id,btn){if(btn){btn.disabled=true;btn.textContent='Saving…'}api('prep',{id:id}).then(loadDay).catch(errorBox)}
function openMastery(){if(!active)return;api('mastery',{row:active.row}).then(function(m){if(!m.available){document.getElementById('app').innerHTML='<div class="card"><h2>Ready Check</h2><p>'+esc(m.message||'This check is not ready yet.')+'</p><button onclick="showWork(active)">Back</button></div>';return}var h='<div class="card"><h2>Ready Check</h2><p>Do this on your own. It is okay if something needs more practice.</p>';(m.questions||[]).forEach(function(q,i){h+='<div style="padding:12px 0;border-top:1px solid var(--line)"><b>'+esc((q.number||i+1)+'. '+q.prompt)+'</b>';if(q.choices&&q.choices.length){q.choices.forEach(function(c){h+='<label style="display:block;margin:9px 0"><input type="radio" name="mq'+i+'" value="'+esc(c)+'"> '+esc(c)+'</label>'})}else h+='<div style="margin-top:8px"><input id="mq'+i+'" style="font:inherit;font-size:16px;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px"></div>';h+='</div>'});h+='<div class="actions"><button class="finish" onclick="submitMastery(\''+esc(m.checkId)+'\','+(m.questions||[]).length+',this)">Check My Answers</button><button onclick="showWork(active)">Not Yet</button></div></div>';document.getElementById('app').innerHTML=h}).catch(errorBox)}
function submitMastery(checkId,count,btn){var ans=[];for(var i=0;i<count;i++){var r=document.querySelector('input[name="mq'+i+'"]:checked'),t=document.getElementById('mq'+i);ans.push(r?r.value:(t?t.value:''))}if(btn){btn.disabled=true;btn.textContent='Checking…'}api('submit',{row:active.row,checkId:checkId,answers:JSON.stringify(ans)}).then(function(r){document.getElementById('app').innerHTML='<div class="card"><h2>'+(r.mastered?'You’re ready to move forward!':'Good work — let’s keep practicing.')+'</h2><p><b>'+esc(r.correct)+' of '+esc(r.total)+' correct</b></p><p>'+esc(r.feedback||'')+'</p><button onclick="loadDay()">Back to My Work</button></div>'}).catch(errorBox)}
window.addEventListener('hashchange',function(){backend='';init()});init();
</script></body></html>
