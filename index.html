<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="School Portal">
<title>School Portal</title><link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png">
<style>
:root{--bg:#f5f7fa;--panel:#fff;--text:#172033;--muted:#667085;--line:#d7dee8;--accent:#2563eb;--soft:#e5f1ff;--help:#ffe0e0;--done:#daf5e3}
body[data-theme="cosmic"]{--bg:#3b197a;--panel:#fffaff;--text:#28133f;--muted:#725b87;--line:#b993ff;--accent:#8b5cf6;--soft:#dcc8ff;--help:#ffd5e2;--done:#c9f5dc}
body[data-theme="ocean"]{--bg:#00779b;--panel:#f9feff;--text:#103746;--muted:#547b88;--line:#65cde5;--accent:#0ea5e9;--soft:#bfefff;--help:#ffd8d3;--done:#c5f3e6}
body[data-theme="garden"]{--bg:#267a3b;--panel:#fbfff9;--text:#203a25;--muted:#5f795f;--line:#88d398;--accent:#22c55e;--soft:#c9efb5;--help:#ffd9cf;--done:#bff0ca}
body[data-theme="studio"]{--bg:#f06449;--panel:#fffaf7;--text:#40252f;--muted:#825e68;--line:#ffad91;--accent:#f43f5e;--soft:#e5c3ff;--help:#ffd0da;--done:#c5f1cf}
body[data-theme="dark"]{--bg:#10121a;--panel:#1c1f2b;--text:#f7f8fc;--muted:#b3b8c8;--line:#363b4d;--accent:#a78bfa;--soft:#243a52;--help:#512a34;--done:#1e4938}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
.shell{max-width:760px;margin:auto;padding:14px 12px 36px}header{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:6px 0 12px}.brand h1{font-size:1.35rem;margin:0}.brand small{color:var(--muted)}
.toolbar{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}button,select,a.btn{font:inherit;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);padding:10px 13px;text-decoration:none;font-weight:650}button:active,a.btn:active{transform:scale(.98)}
.hero,.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 10px rgba(0,70,90,.05)}.hero{border-top:5px solid var(--accent)}
.muted{color:var(--muted)}.note,.joke{background:var(--soft);border-radius:13px;padding:12px 13px;margin-top:10px;line-height:1.45}.label{font-size:.82rem;font-weight:800;color:var(--muted);margin-bottom:5px}
.section{font-size:1.05rem;margin:20px 2px 8px}.assignment h3{margin:0 0 6px}.assignment p{line-height:1.48}.meta{color:var(--muted);font-size:.92rem}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.start{background:#ddecff}.help{background:var(--help)}.finish{background:var(--done)}
.status{display:inline-block;border-radius:999px;background:var(--soft);padding:5px 9px;font-size:.85rem;font-weight:700}.empty{text-align:center;color:var(--muted);padding:28px 12px}
.work{min-height:70vh;display:flex;flex-direction:column;justify-content:center;text-align:center}.work h2{font-size:1.8rem;margin:8px 0}.clock{font-size:2.8rem;font-weight:800;margin:22px 0 4px}.instruction{font-size:1.08rem;line-height:1.55;max-width:600px;margin:15px auto}.work .actions{justify-content:center}.work .actions button,.work .actions a{min-width:145px}
.helpbox{margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.lesson-step{margin:14px 0;padding:13px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.lesson-step h3{margin:0 0 10px}.video-frame{position:relative;width:100%;padding-top:56.25%;overflow:hidden;border-radius:12px;background:#000}.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.worksheet-frame{width:100%;height:720px;border:1px solid var(--line);border-radius:12px;background:white}.helpgrid{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}.answer{background:var(--soft);border-radius:12px;padding:12px;margin-top:10px;text-align:left;line-height:1.5}
.error{background:#fff1f1;border-color:#f3b6b6}.hidden{display:none!important}details{margin-top:7px}summary{font-weight:700;cursor:pointer}
@media(max-width:600px){.shell{padding:10px 10px 28px}header{align-items:flex-start;flex-wrap:wrap}.brand{flex:1 0 100%}.brand h1{font-size:1.25rem}.toolbar button{padding:9px 11px}.hero,.card{padding:14px}.work .actions{display:grid}.work .actions button,.work .actions a{width:100%}.clock{font-size:2.35rem}}
</style></head><body data-theme="clean"><div class="shell">
<header><div class="brand"><h1>Moran School</h1><small id="portalDate">Opening…</small></div><div class="toolbar"><button onclick="shiftDay(-1)">◀</button><button onclick="today()">Today</button><button id="weekBtn" onclick="toggleWeek()">Week</button><button onclick="shiftDay(1)">▶</button><select id="themeSelect" onchange="changeTheme(this.value)"><option value="clean">Clean</option><option value="cosmic">Cosmic</option><option value="ocean">Ocean</option><option value="garden">Garden</option><option value="studio">Creative Studio</option><option value="dark">Dark</option></select></div></header>
<div id="app"><div class="card empty">Opening School Portal…</div></div>
</div><script>
var backend='',currentDate='',data=null,active=null,clockTimer=null,mode='day';
function pad2(n){return n<10?'0'+n:String(n)}
function iso(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function decode64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return atob(s)}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function api(action,params){return new Promise(function(resolve,reject){
 var cb='school_cb_'+Date.now()+'_'+Math.floor(Math.random()*100000),s=document.createElement('script'),q=['api='+encodeURIComponent(action),'callback='+encodeURIComponent(cb)];
 params=params||{};Object.keys(params).forEach(function(k){q.push(encodeURIComponent(k)+'='+encodeURIComponent(params[k]))});
 window[cb]=function(r){delete window[cb];if(s.parentNode)s.parentNode.removeChild(s);if(r&&r.ok)resolve(r.data);else reject(new Error(r&&r.error?r.error:'School Portal request failed.'))};
 s.onerror=function(){delete window[cb];if(s.parentNode)s.parentNode.removeChild(s);reject(new Error('Could not reach the School Portal.'))};
 s.src=backend+(backend.indexOf('?')>=0?'&':'?')+q.join('&');document.head.appendChild(s);
})}
function errorBox(err){document.getElementById('app').innerHTML='<div class="card error"><b>School Portal could not load.</b><p>'+esc(err&&err.message?err.message:err)+'</p><button onclick="loadDay()">Try Again</button></div>'}
function init(){var h=location.hash.replace(/^#/,'');var m=h.match(/(?:^|&)b=([^&]+)/);if(m){try{backend=decode64u(decodeURIComponent(m[1]));localStorage.setItem('schoolPortalBackend',backend)}catch(e){}}
 if(!backend)backend=localStorage.getItem('schoolPortalBackend')||'';currentDate=iso(new Date());
 if(!backend){document.getElementById('app').innerHTML='<div class="card error"><b>This School Portal link is incomplete.</b><p>Please open the School Portal button from the email Dad sent.</p></div>';return}loadDay()}
function loadDay(){stopClock();active=null;document.body.className='';document.getElementById('app').innerHTML='<div class="card empty">Opening school day…</div>';api('data',{date:currentDate}).then(function(d){data=d;renderDay()}).catch(errorBox)}
function shiftDay(n){var d=new Date(currentDate+'T12:00:00');d.setDate(d.getDate()+n*(mode==='week'?7:1));currentDate=iso(d);if(mode==='week')loadWeek();else loadDay()}
function today(){mode='day';currentDate=iso(new Date());setModeButton();loadDay()}
function setModeButton(){var b=document.getElementById('weekBtn');if(b)b.textContent=mode==='week'?'Day':'Week'}
function toggleWeek(){mode=mode==='week'?'day':'week';setModeButton();if(mode==='week')loadWeek();else loadDay()}
function applyTheme(theme){var allowed=['clean','cosmic','ocean','garden','studio','dark'];theme=allowed.indexOf(theme)>=0?theme:'clean';document.body.dataset.theme=theme;var s=document.getElementById('themeSelect');if(s)s.value=theme}
function changeTheme(theme){applyTheme(theme);api('theme',{theme:theme}).catch(function(err){console.error(err)})}
function loadWeek(){stopClock();active=null;document.getElementById('app').innerHTML='<div class="card empty">Opening your week…</div>';api('week',{date:currentDate}).then(renderWeek).catch(errorBox)}
function openWeekDay(date){mode='day';currentDate=date;setModeButton();loadDay()}
function firstName(){return data&&data.view==='natalie'?'Natalie':'Emma'}
function greetingHtml(){var g=data.dailyGreeting;if(!g)return'';return '<div class="note"><div class="label">From Mom & Dad</div>'+esc(g.note)+'</div><div class="joke"><div class="label">Silly joke of the day</div><b>'+esc(g.jokeQuestion)+'</b><details><summary>Show punchline</summary><div style="margin-top:6px">'+esc(g.jokeAnswer)+'</div></details></div>'}
function renderDay(){document.getElementById('portalDate').textContent=data.displayDate||currentDate;applyTheme(data.theme||'clean');var items=data.assignments||[],isToday=data.date===iso(new Date()),h='';if(isToday)h+='<section class="hero"><h2 style="margin:0">Good morning, '+esc(firstName())+'</h2><div class="muted">'+esc(data.displayDate)+'</div>'+greetingHtml()+'</section>';else h+='<h2 class="section">'+esc(data.displayDate)+'</h2>';
 if(data.prepItems&&data.prepItems.length){h+='<h2 class="section">Get Ready</h2>';data.prepItems.forEach(function(x){h+='<div class="card"><b>'+esc(x.action)+': '+esc(x.item)+'</b>'+(x.notes?'<p class="muted">'+esc(x.notes)+'</p>':'')+'<div class="actions"><button onclick="finishPrep(\''+esc(x.prepId)+'\',this)">I’ve Got It Ready</button></div></div>'})}
 if(!items.length)h+='<div class="card empty">Nothing is assigned for this day yet.</div>';else{if(data.view==='emma')h+='<h2 class="section">Your Jobs'+(isToday?' — Choose the Order':'')+'</h2>';else h+='<h2 class="section">'+(isToday?'Today’s Schedule':'Schedule')+'</h2>';items.forEach(function(a){h+=assignmentCard(a)})}
 document.getElementById('app').innerHTML=h}
function renderWeek(w){var range=(w.startLabel||'')+' – '+(w.endLabel||'');document.getElementById('portalDate').textContent=range;var items=w.assignments||[],prep=w.studentPrep||[],h='<h2 class="section">Your Week</h2>';if(prep.length){h+='<div class="card"><b>Get Ready This Week</b>';prep.forEach(function(x){h+='<div style="padding:9px 0;border-top:1px solid var(--line)">'+esc(x.action)+': '+esc(x.item)+' <span class="muted">('+esc(x.dateLabel)+')</span></div>'});h+='</div>'}var base=new Date(w.start+'T12:00:00'),names=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];for(var i=0;i<7;i++){var d=new Date(base);d.setDate(base.getDate()+i);var key=iso(d),dayItems=items.filter(function(a){return a.date===key});h+='<section class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><b>'+names[i]+'</b><div class="meta">'+(d.getMonth()+1)+'/'+d.getDate()+'</div></div><button onclick="openWeekDay(\''+key+'\')">Open Day</button></div>';if(!dayItems.length)h+='<div class="muted" style="padding-top:12px">No school work</div>';dayItems.forEach(function(a){h+='<div style="padding:11px 0;border-top:1px solid var(--line)"><b>'+esc(a.subject)+'</b><div>'+esc(a.assignment)+'</div><div class="meta">'+esc(a.status)+' · '+esc(a.plannedMinutes)+' min</div></div>'});h+='</section>'}document.getElementById('app').innerHTML=h;setModeButton()}
function assignmentCard(a){var future=currentDate>iso(new Date()),working=['In Progress','Still Working','Need Help'].indexOf(a.status)>=0,done=a.status==='Done',b=(done||future)?'':working?'<button class="start" onclick="continueWork('+a.row+')">Continue</button>':'<button class="start" onclick="startWork('+a.row+',this)">Start</button>';var state=done?'<span class="status">Finished</span>':future?'<span class="status">Upcoming</span>':'';
 return '<article class="card assignment"><h3>'+esc(a.subject)+'</h3>'+(a.time&&String(a.time).toLowerCase()!=='flexible'?'<div class="meta">'+esc(a.time)+'</div>':'')+'<p>'+esc(a.assignment)+'</p><div class="actions">'+b+state+'</div></article>'}
function findAssignment(row){var arr=data&&data.assignments||[];for(var i=0;i<arr.length;i++)if(Number(arr[i].row)===Number(row))return arr[i];return null}
function primaryResource(a){var rs=a.resources||[];for(var i=0;i<rs.length;i++)if(/video|youtube|website|online|lesson/i.test([rs[i].type,rs[i].label,rs[i].url].join(' ')))return rs[i];return rs[0]||null}
function shouldLaunch(a){return ['video','online','mixed'].indexOf(a.workFormat)>=0}
function videoEmbedUrl(r){var s=[r&&r.url||'',r&&r.label||''].join(' ');if(/introduction-to-the-coordinate-plane/i.test(s))return'https://www.youtube-nocookie.com/embed/pAlq9fFwtus?rel=0';if(/multiplying-mixed-numbers/i.test(s))return'https://www.youtube-nocookie.com/embed/hjbSbHr3Fhk?rel=0';if(/multiplying-fractions/i.test(s))return'https://www.youtube-nocookie.com/embed/CTKMK1ZGLuk?rel=0';var m=s.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?v=|embed\/))([A-Za-z0-9_-]{11})/);return m?'https://www.youtube-nocookie.com/embed/'+m[1]+'?rel=0':''}
function startWork(row,btn){var a=findAssignment(row);if(!a)return;if(btn){btn.disabled=true;btn.textContent='Starting…'}api('start',{row:row}).then(function(){a.status='In Progress';showWork(a)}).catch(errorBox)}
function continueWork(row){var a=findAssignment(row);if(!a)return;showWork(a)}
function workLabel(a){if(a.completionMode==='placement')return'Paper placement';return{video:'Video lesson',online:'Online lesson',paper:'Paper work',book:'Book / reading','hands-on':'Hands-on activity',mixed:'Mixed lesson',offscreen:'Off-screen work'}[a.workFormat]||'Assignment'}
function workInstruction(a){if(a.completionMode==='placement')return'Work on your printed placement check. You do not need to keep using this screen. Come back here if you need help or when you are finished.';if(a.workFormat==='paper')return'Work from your printed page. Come back here if you need help or when you are finished.';if(a.workFormat==='book')return'Use the book or pages named in your assignment. Come back here if you need help or when you are finished.';if(a.workFormat==='hands-on')return'Do the activity described in your assignment. Keep this screen nearby only if you need help or when you are finished.';if(a.workFormat==='video'||a.workFormat==='online')return'Your lesson opens separately. When you come back here, you can get help or finish your work.';if(a.workFormat==='mixed')return'Follow the lesson resources in order. Some parts use the screen and some parts happen away from it.';return'Do the assignment described above. You only need this screen for help or when you are finished.'}
function showWork(a){active=a;var videos=[],paper=[],other=[];(a.resources||[]).forEach(function(r){var e=videoEmbedUrl(r);if(e)videos.push({r:r,e:e});else if(/printable|worksheet|paper/i.test([r.type,r.label].join(' ')))paper.push(r);else other.push(r)});var sections='';if(videos.length){sections+='<section class="lesson-step"><h3>1. Teaching Video and Example</h3>'+videos.map(function(x){return '<div class="video-frame" style="margin-top:10px"><iframe src="'+esc(x.e)+'" title="'+esc(x.r.label||'Teaching video')+'" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe></div>'}).join('')+'</section>'}if(paper.length){sections+='<section class="lesson-step"><h3>2. Practice Sheet</h3>'+paper.map(function(r){return '<iframe class="worksheet-frame" src="'+esc(r.url)+'" title="Practice Sheet"></iframe>'}).join('')+'</section>'}if(other.length){sections+='<section class="lesson-step">'+other.map(function(r){return '<a class="btn" href="'+esc(r.url)+'" target="_blank">'+esc(r.label||'Open Resource')+'</a>'}).join('')+'</section>'}document.getElementById('app').innerHTML='<article class="card work"><span class="status">'+esc(workLabel(a))+'</span><h2>'+esc(a.subject)+'</h2><div style="white-space:pre-line">'+esc(a.assignment)+'</div>'+sections+'<section class="lesson-step"><h3>3. Give your Practice Sheet to Dad/Mom</h3><div class="actions"><button class="help" onclick="showHelpMenu()">Need Help</button><button class="finish" onclick="finishActive(this)">Finished</button></div><div id="helpArea"></div></section><div class="actions"><button onclick="loadDay()">Back to Today</button></div></article>'}
function startClock(){stopClock();function tick(){var e=document.getElementById('clock');if(e)e.textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}tick();clockTimer=setInterval(tick,15000)}
function stopClock(){if(clockTimer){clearInterval(clockTimer);clockTimer=null}}
function showHelpMenu(){if(!active)return;var placement=active.completionMode==='placement',h='<div class="helpbox"><b>What would help?</b><div class="muted">Choose one. This is here to help you get unstuck, not to give you the answer.</div><div class="helpgrid">';if(placement)h+='<button onclick="helpChoice(\'directions\',this)">Explain the directions</button><button onclick="helpChoice(\'placementMeaning\',this)">What does “not learned yet” mean?</button><button onclick="helpChoice(\'resource\',this)">Something is not working</button>';else h+='<button onclick="helpChoice(\'hint1\',this)">Give me a hint</button><button onclick="helpChoice(\'explain\',this)">Explain it another way</button><button onclick="helpChoice(\'example\',this)">Show me a similar example</button><button onclick="helpChoice(\'directions\',this)">I do not understand the directions</button>';h+='<button class="help" onclick="helpChoice(\'parent\',this)">I still need a parent</button><button onclick="closeHelp()">Close</button></div></div>';document.getElementById('helpArea').innerHTML=h}
function closeHelp(){var e=document.getElementById('helpArea');if(e)e.innerHTML=''}
function helpChoice(action,btn){if(!active)return;if(btn){btn.disabled=true;btn.textContent='Getting help…'}api('help',{row:active.row,action:action}).then(function(r){var h='<div class="helpbox"><b>'+esc(r.title||'Help')+'</b><div class="answer">'+esc(r.text||'')+'</div><div class="helpgrid">';if(r.hasAnotherHint)h+='<button onclick="helpChoice(\'hint2\',this)">Give me another hint</button>';if(!r.parent)h+='<button onclick="showHelpMenu()">More help choices</button>';h+='<button onclick="closeHelp()">Close</button></div></div>';document.getElementById('helpArea').innerHTML=h}).catch(errorBox)}
function finishActive(btn){if(!active)return;if(btn){btn.disabled=true;btn.textContent='Saving…'}if(active.completionMode==='mastery')return openMastery();api('finish',{row:active.row}).then(function(){loadDay()}).catch(errorBox)}
function finishPrep(id,btn){if(btn){btn.disabled=true;btn.textContent='Saving…'}api('prep',{id:id}).then(loadDay).catch(errorBox)}
function openMastery(){if(!active)return;api('mastery',{row:active.row}).then(function(m){if(!m.available){document.getElementById('app').innerHTML='<div class="card"><h2>Ready Check</h2><p>'+esc(m.message||'This check is not ready yet.')+'</p><button onclick="showWork(active)">Back</button></div>';return}var h='<div class="card"><h2>Ready Check</h2><p>Do this on your own. It is okay if something needs more practice.</p>';(m.questions||[]).forEach(function(q,i){h+='<div style="padding:12px 0;border-top:1px solid var(--line)"><b>'+esc((q.number||i+1)+'. '+q.prompt)+'</b>';if(q.choices&&q.choices.length){q.choices.forEach(function(c){h+='<label style="display:block;margin:9px 0"><input type="radio" name="mq'+i+'" value="'+esc(c)+'"> '+esc(c)+'</label>'})}else h+='<div style="margin-top:8px"><input id="mq'+i+'" style="font:inherit;font-size:16px;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px"></div>';h+='</div>'});h+='<div class="actions"><button class="finish" onclick="submitMastery(\''+esc(m.checkId)+'\','+(m.questions||[]).length+',this)">Check My Answers</button><button onclick="showWork(active)">Not Yet</button></div></div>';document.getElementById('app').innerHTML=h}).catch(errorBox)}
function submitMastery(checkId,count,btn){var ans=[];for(var i=0;i<count;i++){var r=document.querySelector('input[name="mq'+i+'"]:checked'),t=document.getElementById('mq'+i);ans.push(r?r.value:(t?t.value:''))}if(btn){btn.disabled=true;btn.textContent='Checking…'}api('submit',{row:active.row,checkId:checkId,answers:JSON.stringify(ans)}).then(function(r){document.getElementById('app').innerHTML='<div class="card"><h2>'+(r.mastered?'You’re ready to move forward!':'Good work — let’s keep practicing.')+'</h2><p><b>'+esc(r.correct)+' of '+esc(r.total)+' correct</b></p><p>'+esc(r.feedback||'')+'</p><button onclick="loadDay()">Back to My Work</button></div>'}).catch(errorBox)}
window.addEventListener('hashchange',function(){backend='';init()});init();
</script></body></html>
